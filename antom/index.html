<title>Antom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Young+Serif&display=swap">
<style>
/* Layout: porcelain app shell – big serif titles, every dish a cut-out plate on its own soft tint; phones get a glass tab bar, wide screens a sidebar with the week beside a draggable cookbook shelf */
:root {
  --bg: #f2f4f8;
  --surface: #ffffff;
  --surface-2: #f0f3f8;
  --surface-3: #e5eaf2;
  --line: #e1e6ee;
  --ink: #121833;
  --ink-2: #565f7c;
  --ink-3: #868da5;
  --cobalt: #2442b0;
  --cobalt-press: #1a3393;
  --cobalt-soft: #e4e9fb;
  --on-cobalt: #ffffff;
  --heat: #d9502a;
  --heat-soft: #fde8e0;
  --ok: #1d8a61;
  --ok-soft: #dcf2e8;
  --danger: #c0352b;
  --fryer: #15171c;
  --fryer-2: #22252c;
  --fryer-3: #353943;
  --fryer-ink: #f5f3ee;
  --fryer-dim: #a4a8b3;
  --fryer-heat: #ff7d55;
  --tint-mix: 100%;
  --glass: rgba(255, 255, 255, .80);
  --bar: rgba(246, 248, 251, .88);
  --scrim: rgba(10, 14, 30, .42);
  --shadow-1: 0 1px 2px rgba(18, 24, 51, .05), 0 3px 12px rgba(18, 24, 51, .05);
  --shadow-2: 0 4px 10px rgba(18, 24, 51, .06), 0 18px 40px rgba(18, 24, 51, .13);
  --plate-shadow: drop-shadow(0 9px 10px rgba(18, 24, 51, .16)) drop-shadow(0 2px 2px rgba(18, 24, 51, .10));
  --font-display: "Young Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-ui: "Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f1e; --surface: #141a31; --surface-2: #1b2240; --surface-3: #242c4e; --line: #29325a;
    --ink: #eef1fa; --ink-2: #a6aecb; --ink-3: #757d9c;
    --cobalt: #8fa5ff; --cobalt-press: #aebdff; --cobalt-soft: #1f2a5a; --on-cobalt: #0b1030;
    --heat: #ff7d55; --heat-soft: #3b2019; --ok: #52c99c; --ok-soft: #173b30; --danger: #ff8a80;
    --fryer: #08090c; --fryer-2: #16191f; --fryer-3: #2a2e37; --fryer-ink: #f5f3ee; --fryer-dim: #9da2ad; --fryer-heat: #ff7d55;
    --tint-mix: 22%;
    --glass: rgba(20, 26, 49, .80); --bar: rgba(14, 19, 37, .88); --scrim: rgba(0, 0, 0, .6);
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .35), 0 3px 12px rgba(0, 0, 0, .25);
    --shadow-2: 0 18px 44px rgba(0, 0, 0, .55);
    --plate-shadow: drop-shadow(0 10px 12px rgba(0, 0, 0, .45)) drop-shadow(0 2px 3px rgba(0, 0, 0, .35));
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0f1e; --surface: #141a31; --surface-2: #1b2240; --surface-3: #242c4e; --line: #29325a;
  --ink: #eef1fa; --ink-2: #a6aecb; --ink-3: #757d9c;
  --cobalt: #8fa5ff; --cobalt-press: #aebdff; --cobalt-soft: #1f2a5a; --on-cobalt: #0b1030;
  --heat: #ff7d55; --heat-soft: #3b2019; --ok: #52c99c; --ok-soft: #173b30; --danger: #ff8a80;
  --fryer: #08090c; --fryer-2: #16191f; --fryer-3: #2a2e37; --fryer-ink: #f5f3ee; --fryer-dim: #9da2ad; --fryer-heat: #ff7d55;
  --tint-mix: 22%;
  --glass: rgba(20, 26, 49, .80); --bar: rgba(14, 19, 37, .88); --scrim: rgba(0, 0, 0, .6);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .35), 0 3px 12px rgba(0, 0, 0, .25);
  --shadow-2: 0 18px 44px rgba(0, 0, 0, .55);
  --plate-shadow: drop-shadow(0 10px 12px rgba(0, 0, 0, .45)) drop-shadow(0 2px 3px rgba(0, 0, 0, .35));
  color-scheme: dark;
}

/* dish tints (the tablecloth under each plate) */
.t-sky { --tint: #dae5f8; } .t-rose { --tint: #f8dcd4; } .t-butter { --tint: #f6e9c5; } .t-sage { --tint: #dbead3; }
.t-lilac { --tint: #e5ddf3; } .t-berry { --tint: #f5d5e1; } .t-oat { --tint: #eee4d2; } .t-mint { --tint: #d3ede3; }
.t-apricot { --tint: #f9dcc4; } .t-plain { --tint: #e3e8f1; }
.tinted { background: var(--tint, #e3e8f1); background: color-mix(in oklab, var(--tint, #e3e8f1) var(--tint-mix), var(--surface)); }
.r0 { --rot: -7deg; } .r1 { --rot: -4deg; } .r2 { --rot: -1.5deg; } .r3 { --rot: 1deg; } .r4 { --rot: 3deg; } .r5 { --rot: 5.5deg; } .r6 { --rot: 8deg; }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font: 400 1.0625rem/1.5 var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
html.locked { overflow: hidden; }
[hidden] { display: none !important; }
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--cobalt); }
:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; }
.ic { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.ic.fill { fill: currentColor; stroke: none; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-3); }
.today h2, .r-title, .card-t, .cook-title, .pick-row b, .shelf-row b { hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word; }

/* ---------- plates ---------- */
.plate-wrap { position: relative; display: grid; place-items: center; width: 100%; container-type: inline-size; }
.plate { width: 100%; height: auto; transform: rotate(var(--rot, 0deg)); filter: var(--plate-shadow); -webkit-user-drag: none; user-select: none; }
.ph-letter { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 34cqw; line-height: 1; color: var(--cobalt); pointer-events: none; }

/* ---------- shell ---------- */
.app-bar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
  background: var(--bar);
  -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
}
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 1.4rem; line-height: 1; color: var(--ink); }
.mark {
  width: 36px; height: 36px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  background: var(--surface); color: var(--cobalt);
  box-shadow: inset 0 0 0 2px var(--cobalt), inset 0 0 0 6px var(--surface), inset 0 0 0 7px var(--cobalt-soft), var(--shadow-1);
  font-family: var(--font-display); font-size: 1.05rem; padding-top: 1px;
}
.bar-actions { display: flex; align-items: center; gap: 8px; }
.sync {
  display: inline-flex; align-items: center; gap: 7px;
  min-height: 38px; padding: 6px 12px; border-radius: 999px; border: 0;
  background: var(--surface); color: var(--ink-2); box-shadow: var(--shadow-1);
  font-size: .875rem; font-weight: 700;
}
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.sync[data-state="shared"] i { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.sync[data-state="loading"] i { animation: pulse 1s ease-in-out infinite alternate; }
.icon-btn { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.icon-btn .ic { width: 21px; height: 21px; }
.sidebar { display: none; }

.views { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 4px calc(112px + env(safe-area-inset-bottom, 0px)); }
.view { display: none; }
.app[data-tab="week"] #viewWeek, .app[data-tab="book"] #viewBook, .app[data-tab="shop"] #viewShop { display: block; animation: view-in .28s var(--ease); }
@keyframes view-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.view-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 12px; margin: 6px 0 18px; }
.view-title { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(2.1rem, 8vw, 2.75rem); line-height: 1.04; letter-spacing: -.01em; color: var(--ink); text-wrap: balance; }
@media (max-width: 359px) {
  .head-btn { width: 44px; min-height: 44px; padding: 0; border-radius: 50%; }
  .head-btn .lbl { display: none; }
  .actions .btn { padding-inline: 12px; gap: 6px; }
  .actions .lbl-move { display: none; }
}
.view-sub { grid-column: 1 / -1; margin: 4px 0 0; color: var(--ink-2); font-size: .9875rem; }

.tabbar {
  position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 25;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
  padding: 6px; border-radius: 26px;
  background: var(--bar); box-shadow: var(--shadow-2);
  -webkit-backdrop-filter: blur(18px) saturate(1.5); backdrop-filter: blur(18px) saturate(1.5);
}
.tabbar button {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 56px; border: 0; border-radius: 20px; background: transparent; color: var(--ink-3);
  font-size: .8125rem; font-weight: 700;
  transition: background .2s, color .2s;
}
.tabbar button .ic { width: 24px; height: 24px; }
.tabbar button[aria-selected="true"] { background: var(--cobalt-soft); color: var(--cobalt); }
.count {
  display: inline-grid; place-items: center; min-width: 1.45em; height: 1.45em; padding: 0 .35em;
  border-radius: 999px; background: var(--heat); color: #fff;
  font-size: .72rem; font-weight: 800; font-variant-numeric: tabular-nums;
}
.count:empty { display: none; }
.tabbar .count { position: absolute; top: 5px; left: calc(50% + 7px); }

@media (min-width: 1000px) {
  .app-bar, .tabbar { display: none; }
  .sidebar {
    display: flex; flex-direction: column; gap: 22px;
    position: fixed; inset: 0 auto 0 0; width: 248px; z-index: 20;
    padding: 26px 18px 22px; background: var(--surface); border-right: 1px solid var(--line);
  }
  .sidebar .brand { font-size: 1.6rem; padding: 0 8px; }
  .side-nav { display: grid; gap: 4px; }
  .side-nav button {
    display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px;
    border: 0; border-radius: 14px; background: transparent; color: var(--ink-2); font-weight: 700; text-align: left;
  }
  .side-nav button .ic { width: 22px; height: 22px; }
  .side-nav button .count { margin-left: auto; }
  .side-nav button[aria-selected="true"] { background: var(--cobalt-soft); color: var(--cobalt); }
  .side-foot { margin-top: auto; display: grid; gap: 8px; justify-items: start; }
  .side-set { display: flex; align-items: center; gap: 10px; border: 0; background: none; color: var(--ink-2); font-weight: 600; padding: 8px; border-radius: 10px; }
  .views { margin-left: 248px; padding: 30px 40px 48px; max-width: none; }
}

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 10px 18px; border-radius: 16px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-weight: 700; line-height: 1.15; text-align: center; text-decoration: none;
  transition: transform .15s var(--ease), background .2s, box-shadow .2s;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--cobalt); border-color: var(--cobalt); color: var(--on-cobalt); box-shadow: 0 6px 16px color-mix(in srgb, var(--cobalt) 30%, transparent); }
.btn.glass { background: var(--glass); border-color: transparent; }
.btn.quiet { background: var(--surface-2); border-color: transparent; }
.btn.ai { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn.danger { color: var(--danger); }
.btn.small { min-height: 40px; padding: 7px 13px; font-size: .9375rem; border-radius: 13px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.link-btn { border: 0; background: none; color: var(--cobalt); font-weight: 700; padding: 6px; }

/* ---------- week ---------- */
.week-layout { display: block; }
.shelf { display: none; }
.daystrip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin: 0 0 18px; }
.daypill {
  display: grid; justify-items: center; gap: 1px; padding: 9px 0 8px;
  border: 0; border-radius: 18px; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1);
}
.daypill small { font-size: .75rem; font-weight: 700; color: var(--ink-3); }
.daypill b { font-size: 1.15rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.25; }
.dots { display: flex; gap: 3px; height: 6px; align-items: center; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--cobalt); }
.dots i.off { background: var(--surface-3); }
.daypill.is-today { background: var(--cobalt); color: var(--on-cobalt); box-shadow: 0 8px 18px color-mix(in srgb, var(--cobalt) 32%, transparent); }
.daypill.is-today small { color: inherit; opacity: .8; }
.daypill.is-today .dots i { background: var(--on-cobalt); }
.daypill.is-today .dots i.off { background: var(--on-cobalt); opacity: .3; }

.today {
  position: relative; overflow: hidden;
  display: grid; grid-template-columns: minmax(0, 1fr) clamp(130px, 38vw, 210px); gap: 6px 10px; align-items: center;
  grid-template-areas: "text plate" "actions actions" "also also";
  padding: 22px 0 18px 20px; margin-bottom: 30px; border-radius: 30px; box-shadow: var(--shadow-1);
}
.today-text { grid-area: text; min-width: 0; }
@media (min-width: 600px) {
  .today { grid-template-areas: "text plate" "actions plate" "also also"; }
  .today-text { align-self: end; }
  .today-actions { align-self: start; }
  .today-actions .btn { flex: 0 0 auto !important; }
}
.today.skeleton { min-height: 230px; }
.today .eyebrow { margin: 0; font-size: .78rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--cobalt); }
.today h2 { margin: 8px 0 8px; font-family: var(--font-display); font-weight: 400; font-size: clamp(1.55rem, 7.4vw, 2.5rem); line-height: 1.04; text-wrap: balance; }
.today-meta { margin: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--ink-2); font-size: .9375rem; font-weight: 600; }
.today-meta span, .meal .sub span, .card-m span { display: inline-flex; align-items: center; gap: 5px; }
.today-meta .ic { width: 17px; height: 17px; }
.heat { color: var(--heat); }
.today-actions { grid-area: actions; display: flex; gap: 8px; margin-top: 10px; padding-right: 20px; }
.today-actions .btn { flex: 1 1 0; }
.today-plate { grid-area: plate; margin-right: -34px; cursor: pointer; }
.today-plate .plate { animation: plate-in .8s var(--ease) both; }
@keyframes plate-in { from { transform: rotate(calc(var(--rot) - 40deg)) scale(.85); opacity: 0; } to { transform: rotate(var(--rot)); opacity: 1; } }
.today-also {
  grid-area: also; display: flex; align-items: center; gap: 10px;
  margin: 10px 20px 0 0; padding: 12px 0 0; border: 0; border-top: 1px solid color-mix(in srgb, var(--ink) 10%, transparent);
  background: none; color: var(--ink); font-weight: 600; text-align: left; font-size: .9375rem;
}
.today-also .plate-wrap { width: 34px; }
.today-also small { display: block; font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
button.today-also { color: var(--cobalt); font-weight: 700; }

.day { margin-bottom: 24px; scroll-margin-top: 78px; }
.day-head { display: flex; align-items: baseline; gap: 10px; margin: 0 4px 10px; }
.day-head h3 { margin: 0; font-size: 1.1875rem; font-weight: 800; letter-spacing: -.01em; }
.day-head span { color: var(--ink-3); font-size: .9375rem; font-weight: 600; }
.day-head em { margin-left: auto; font-style: normal; font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--cobalt); background: var(--cobalt-soft); padding: 4px 9px; border-radius: 999px; }
.slot { display: grid; gap: 8px; min-height: 76px; border-radius: 22px; }
.slot + .slot { margin-top: 8px; }
.meal {
  display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: center;
  min-height: 76px; padding: 6px 14px 6px 6px; border-radius: 22px;
  background: var(--surface); box-shadow: var(--shadow-1); color: var(--ink);
  cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  transition: transform .18s var(--ease), box-shadow .2s;
}
.meal:active { transform: scale(.985); }
.meal .pl { width: 64px; height: 64px; border-radius: 17px; display: grid; place-items: center; overflow: hidden; }
.meal .pl .plate-wrap { width: 54px; }
.meal .txt { min-width: 0; display: grid; gap: 1px; }
.meal small, .meal-empty small { font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.meal .nm { font-family: var(--font-display); font-weight: 400; font-size: 1.22rem; line-height: 1.15; overflow-wrap: anywhere; }
.meal .sub { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .84rem; font-weight: 600; color: var(--ink-2); margin-top: 2px; }
.meal .sub .ic { width: 15px; height: 15px; }
.meal .chev { color: var(--ink-3); width: 20px; height: 20px; }
.meal.gone .nm { font-family: var(--font-ui); font-weight: 700; color: var(--ink-3); }
.meal.skeleton { background: var(--surface-2); box-shadow: none; animation: pulse 1.1s ease-in-out infinite alternate; }
.ab { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--cobalt-soft); color: var(--cobalt); font: 800 .72rem/1 var(--font-ui); font-style: normal; letter-spacing: 0; vertical-align: 1px; }
.ab.big { min-width: 32px; height: 32px; font-size: .9rem; background: var(--glass); }
.meal-empty {
  display: flex; align-items: center; gap: 14px; width: 100%; min-height: 76px; padding: 6px 14px 6px 6px;
  border: 1.5px dashed color-mix(in srgb, var(--ink) 16%, transparent); border-radius: 22px;
  background: transparent; color: var(--ink-2); text-align: left;
}
.meal-empty .pl { width: 64px; height: 64px; border-radius: 17px; display: grid; place-items: center; background: var(--surface-2); color: var(--cobalt); }
.meal-empty .pl .ic { width: 24px; height: 24px; }
.meal-empty b { display: block; font-weight: 700; color: var(--ink); }
.meal-empty:hover { border-color: var(--cobalt); }
.week-foot { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
@keyframes pulse { from { opacity: .5; } to { opacity: 1; } }

/* drag states (SortableJS) */
.is-chosen { box-shadow: 0 0 0 2px var(--cobalt), var(--shadow-2) !important; }
.is-ghost { opacity: .35; }
.is-drag, .is-fallback { transform: rotate(-2deg) scale(1.03) !important; box-shadow: var(--shadow-2) !important; opacity: 1 !important; }
.is-dragging .slot { outline: 2px dashed color-mix(in srgb, var(--cobalt) 45%, transparent); outline-offset: 3px; }
.is-dragging .slot:has(.is-ghost) .meal-empty { display: none; }
.trash {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 35; transform: translateX(-50%);
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: min(420px, calc(100vw - 32px)); min-height: 66px; padding: 10px 16px; border-radius: 22px;
  border: 2px dashed var(--danger); background: var(--surface); color: var(--danger); font-weight: 800; box-shadow: var(--shadow-2);
}
.trash > :not(.ic):not(span) { display: none !important; }
.trash.is-over { background: var(--danger); color: var(--surface); }

/* ---------- cookbook ---------- */
.search { position: relative; display: block; margin-bottom: 12px; }
.search .ic { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.search input {
  width: 100%; min-height: 52px; padding: 12px 16px 12px 46px;
  border-radius: 18px; border: 1px solid transparent; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1);
}
.search input:focus { outline: none; border-color: var(--cobalt); }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 18px; padding: 2px 16px 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip-f { flex: none; min-height: 40px; padding: 8px 15px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; font-size: .9375rem; }
.chip-f[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.import-card {
  display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px 12px; align-items: center;
  padding: 14px 16px 16px 10px; margin-bottom: 26px; border-radius: 26px; background: var(--surface); box-shadow: var(--shadow-1);
}
@media (min-width: 760px) {
  .import-card { grid-template-columns: 150px minmax(0, 1fr); column-gap: 18px; }

}
.import-card h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.4rem; line-height: 1.1; }
.import-card p { margin: 5px 0 0; color: var(--ink-2); font-size: .9375rem; }
.import-card .row { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; padding-left: 6px; }
.import-card .row .btn { flex: 1 1 auto; }
.empty-box .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 22px 14px; }
@media (min-width: 1000px) { .grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 28px 20px; } }
.card { display: grid; gap: 4px; align-content: start; cursor: pointer; color: var(--ink); outline-offset: 4px; border-radius: 24px; user-select: none; -webkit-user-select: none; }
.card .tile { position: relative; aspect-ratio: 1; border-radius: 24px; display: grid; place-items: center; overflow: hidden; box-shadow: var(--shadow-1); }
.card .tile .plate-wrap { width: 84%; }
.card .tile .plate { transition: transform .5s var(--ease); }
.card:hover .tile .plate { transform: rotate(calc(var(--rot) + 10deg)) scale(1.03); }
.card:active .tile { transform: scale(.98); }
.badges { position: absolute; left: 10px; top: 10px; display: flex; gap: 5px; flex-wrap: wrap; }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--glass); color: var(--ink); font: 800 .7rem/1 var(--font-ui); font-style: normal; letter-spacing: .02em; }
.fry-badge { position: absolute; right: 10px; top: 10px; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--glass); color: var(--heat); }
.fry-badge .ic { width: 16px; height: 16px; }
.card-t { margin: 6px 4px 0; font-family: var(--font-display); font-size: 1.12rem; line-height: 1.15; text-wrap: balance; }
.card-m { margin: 0 4px; font-size: .84rem; font-weight: 600; color: var(--ink-2); }
.empty-box { display: grid; justify-items: center; gap: 10px; text-align: center; padding: 26px 10px; color: var(--ink-2); }
.empty-box .plate-wrap { width: 150px; }

/* shelf on wide screens: drag from here onto a day */
@media (min-width: 1000px) {
  .week-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 360px); gap: 34px; align-items: start; max-width: 1180px; }
  .shelf { display: block; position: sticky; top: 24px; max-height: calc(100vh - 48px); overflow: hidden; border-radius: 26px; background: var(--surface); box-shadow: var(--shadow-1); }
  .shelf-head { padding: 18px 18px 10px; border-bottom: 1px solid var(--line); }
  .shelf-head h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; }
  .shelf-head p { margin: 2px 0 12px; color: var(--ink-2); font-size: .9375rem; }
  .shelf-head .search { margin: 0; }
  .shelf-head .search input { min-height: 44px; background: var(--surface-2); box-shadow: none; }
  .shelf-list { max-height: calc(100vh - 210px); overflow-y: auto; padding: 8px; display: grid; gap: 4px; align-content: start; }
  .shelf-row { display: grid; grid-template-columns: 48px minmax(0, 1fr) 20px; gap: 12px; align-items: center; padding: 6px 8px 6px 6px; border-radius: 16px; cursor: grab; background: var(--surface); }
  .shelf-row:hover { background: var(--surface-2); }
  .shelf-row .pl { width: 48px; height: 48px; border-radius: 13px; display: grid; place-items: center; overflow: hidden; }
  .shelf-row .pl .plate-wrap { width: 40px; }
  .shelf-row b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.02rem; line-height: 1.15; }
  .shelf-row small { color: var(--ink-3); font-size: .8rem; font-weight: 600; }
  .shelf-row .grip { color: var(--ink-3); }
  .slot .shelf-row { min-height: 76px; border-radius: 22px; box-shadow: var(--shadow-1); }
}

/* ---------- shopping ---------- */
.shop-progress { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; margin: -4px 0 16px; color: var(--ink-2); font-size: .9375rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--ok); transition: width .5s var(--ease); }
.add-row { display: flex; gap: 8px; margin-bottom: 6px; }
.add-row input { flex: 1; min-width: 0; min-height: 52px; padding: 12px 16px; border-radius: 18px; border: 1px solid transparent; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.add-row input:focus { outline: none; border-color: var(--cobalt); }
.add-row .btn { min-width: 52px; min-height: 52px; padding: 0; border-radius: 18px; }
.aisle-h { display: flex; align-items: center; gap: 10px; margin: 24px 4px 10px; font-size: .8rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.aisle-h .ai { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 11px; background: var(--surface); color: var(--cobalt); box-shadow: var(--shadow-1); }
.aisle-h .ai .ic { width: 18px; height: 18px; }
.aisle-h em { font-style: normal; color: var(--ink-3); }
.items { list-style: none; margin: 0; padding: 0; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow-1); overflow: hidden; }
.items li { display: flex; align-items: center; border-bottom: 1px solid var(--line); }
.items li:last-child { border-bottom: 0; }
.item { flex: 1; min-width: 0; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 13px 16px; cursor: pointer; }
.item input {
  appearance: none; -webkit-appearance: none; width: 26px; height: 26px; margin: 0; border-radius: 50%;
  border: 2px solid color-mix(in srgb, var(--ink) 28%, transparent); display: grid; place-items: center; cursor: pointer;
  transition: background .18s, border-color .18s, transform .18s var(--ease);
}
.item input:checked { background: var(--ok); border-color: var(--ok); transform: scale(1.06); }
.item input:checked::after { content: ""; width: 11px; height: 6px; margin-top: -3px; border: solid #fff; border-width: 0 0 2.5px 2.5px; transform: rotate(-45deg); }
.item .nm { font-weight: 600; }
.item .from { display: block; font-size: .8rem; font-weight: 500; color: var(--ink-3); margin-top: 1px; }
.item .qty { font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.done .item .nm { text-decoration: line-through; color: var(--ink-3); }
.mini { flex: none; display: grid; place-items: center; width: 44px; height: 44px; margin-right: 6px; border: 0; border-radius: 12px; background: none; color: var(--ink-3); }
.mini:hover { background: var(--surface-2); color: var(--ink); }
.fold { margin-top: 24px; }
.fold > summary { display: flex; align-items: center; gap: 10px; padding: 10px 4px; cursor: pointer; list-style: none; font-weight: 800; color: var(--ink-2); }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary .ic { transition: transform .2s; }
.fold[open] > summary .ic.chev { transform: rotate(90deg); }
.fold > summary small { font-weight: 500; color: var(--ink-3); }
.pantry-list { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 2px 4px; }
.pantry-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: .9375rem; }
.pantry-chip .ic { width: 16px; height: 16px; color: var(--cobalt); }
.shop-empty { display: grid; justify-items: center; text-align: center; gap: 8px; padding: 18px 10px 4px; color: var(--ink-2); }
.shop-empty .plate-wrap { width: min(260px, 70%); }
@media (min-width: 1000px) { #shop { max-width: 780px; } }

/* ---------- sheets ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet {
  position: fixed; z-index: 41; left: 0; right: 0; bottom: 0;
  max-height: 94vh; max-height: 94dvh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); color: var(--ink);
  border-radius: 30px 30px 0 0; box-shadow: var(--shadow-2);
  animation: sheet-up .38s var(--ease);
}
.sheet.full { top: 0; max-height: none; border-radius: 0; }
.sheet.no-anim { animation: none; }
@keyframes sheet-up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (min-width: 760px) {
  .sheet, .sheet.full { left: 50%; top: 50%; bottom: auto; width: min(780px, calc(100vw - 48px)); max-height: 90vh; border-radius: 30px; transform: translate(-50%, -50%); animation: sheet-pop .3s var(--ease); }
  .sheet.no-anim { animation: none; }
  @keyframes sheet-pop { from { opacity: 0; transform: translate(-50%, -47%) scale(.98); } to { opacity: 1; transform: translate(-50%, -50%); } }
}
.grip { width: 42px; height: 5px; border-radius: 3px; background: var(--surface-3); margin: 10px auto 0; }
@media (min-width: 760px) { .grip { display: none; } }
.pad { padding: 18px 20px 26px; display: grid; gap: 16px; }
.sheet h2.s-title { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.75rem; line-height: 1.1; text-wrap: balance; }
.sheet .lead { margin: -6px 0 0; color: var(--ink-2); }
.sheet-x { position: sticky; top: 0; z-index: 5; height: 0; display: flex; justify-content: flex-end; }
.close-x { flex: none; margin: 12px 12px 0 0; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--ink); }
.s-title, .pad > div:first-child { padding-right: 44px; }

.r-hero { position: relative; display: grid; place-items: center; height: min(46vh, 380px); min-height: 280px; padding-top: env(safe-area-inset-top, 0px); overflow: hidden; }
.r-hero .r-plate { width: min(72vw, 310px); }
.r-hero .plate { animation: plate-in .75s var(--ease) both; }
.sheet.no-anim .r-hero .plate { animation: none; }
.r-top { position: absolute; z-index: 3; left: 14px; right: 14px; top: calc(env(safe-area-inset-top, 0px) + 14px); display: flex; justify-content: space-between; align-items: center; }
.r-top-r { display: flex; gap: 8px; align-items: center; }
.glass-btn { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--glass); color: var(--ink); box-shadow: var(--shadow-1); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.r-body { position: relative; margin-top: -28px; padding: 24px 20px 0; border-radius: 28px 28px 0 0; background: var(--surface); display: grid; gap: 14px; }
@media (min-width: 760px) { .r-hero { height: 350px; min-height: 0; } .r-hero .r-plate { width: 290px; } .r-body { padding: 26px 30px 0; } }
.r-eyebrow { margin: 0; font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--cobalt); }
.r-title { margin: -4px 0 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(2rem, 8vw, 2.6rem); line-height: 1.04; text-wrap: balance; }
.r-name { margin: -6px 0 0; color: var(--ink-2); font-size: 1.02rem; }
.r-note { margin: -4px 0 0; display: inline-flex; align-items: center; gap: 6px; color: var(--heat); font-weight: 700; }
.r-tags { margin: -2px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 11px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-size: .84rem; font-weight: 700; }
.pill .ic { width: 15px; height: 15px; }
.pill.veg { background: var(--ok-soft); color: var(--ok); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { display: grid; align-content: start; gap: 3px; padding: 11px 12px; border-radius: 18px; background: var(--surface-2); min-width: 0; }
.stat small { font-size: .7rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.stat b { font-size: 1.06rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat.hot { background: var(--heat-soft); }
.stat.hot b { color: var(--heat); }
.mini-step { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.mini-step button { display: grid; place-items: center; width: 30px; height: 30px; padding: 0; border-radius: 10px; border: 0; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.mini-step button .ic { width: 16px; height: 16px; stroke-width: 2.4; }
.fine { margin: -4px 0 0; font-size: .875rem; color: var(--ink-3); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 5px; border-radius: 18px; background: var(--surface-2); }
.r-seg { position: sticky; top: 0; z-index: 4; box-shadow: 0 0 0 8px var(--surface), 0 14px 14px -12px rgba(0, 0, 0, .3); }
.seg button { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border: 0; border-radius: 14px; background: transparent; color: var(--ink-2); font-weight: 800; }
.seg button[aria-selected="true"], .seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.pane { display: grid; gap: 14px; padding-bottom: 8px; }
.sec { margin: 6px 0 0; font-size: 1.1rem; font-weight: 800; }
.pane .aisle-h { margin: 6px 4px -4px; }
.sec small { font-weight: 500; color: var(--ink-3); font-size: .9375rem; }
.ing { list-style: none; margin: 0; padding: 0; }
.ing li { display: grid; grid-template-columns: 6.4em minmax(0, 1fr); gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.ing .q { font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
.ing small { color: var(--ink-3); }
.ing .pan { color: var(--ink-2); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; counter-reset: st; }
.steps > li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; }
.steps > li::before { counter-increment: st; content: counter(st); display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--surface-2); font-weight: 800; font-variant-numeric: tabular-nums; }
.steps > li.af::before { background: var(--fryer); color: var(--fryer-ink); }
.steps p { margin: 5px 0 0; }
.af-card { display: grid; gap: 10px; padding: 14px; border-radius: 20px; background: var(--fryer); color: var(--fryer-ink); }
.af-card p { margin: 0; }
.chips-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 11px; border-radius: 999px; background: var(--fryer-3); color: var(--fryer-ink); font-size: .9rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.chip .ic { width: 16px; height: 16px; }
.chip.hot { background: var(--fryer-heat); color: #1b0b05; }
.timer-btn { justify-self: start; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 16px; border-radius: 14px; border: 0; background: var(--fryer-ink); color: var(--fryer); font-weight: 800; font-variant-numeric: tabular-nums; }
.fry-card { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; align-items: center; padding: 14px; border-radius: 22px; background: var(--fryer); color: var(--fryer-ink); }
.fry-card .plate-wrap { width: 84px; }
.fry-card h3 { margin: 0 0 8px; font-size: 1.05rem; }
.fry-card ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.fry-card li { display: grid; gap: 4px; }
.fry-card li > span:last-child { color: var(--fryer-dim); font-size: .9375rem; }
.fry-card p { margin: 0; color: var(--fryer-dim); }
.tip { margin: 0; padding: 14px 16px; border-radius: 18px; background: var(--cobalt-soft); color: var(--ink); }
.ck-links { display: grid; gap: 8px; }
.ck-link { display: grid; grid-template-columns: 40px minmax(0, 1fr) 20px; gap: 12px; align-items: center; padding: 10px 14px 10px 10px; border-radius: 18px; background: var(--surface-2); color: var(--ink); text-decoration: none; }
.ck-link > .ic:first-child { width: 40px; height: 40px; padding: 9px; border-radius: 12px; background: var(--surface); color: var(--cobalt); }
.ck-link b { display: block; font-weight: 800; }
.ck-link small { display: block; color: var(--ink-2); font-size: .875rem; }
.actionbar {
  position: sticky; bottom: 0; z-index: 6; margin: 0 -20px; padding: 12px 20px calc(14px + env(safe-area-inset-bottom, 0px));
  background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);
  border-top: 1px solid var(--line);
}
@media (min-width: 760px) { .actionbar { margin: 0 -30px; padding: 14px 30px 18px; } }
.actions { display: flex; gap: 8px; }
.actions .btn { flex: 1 1 0; min-width: 0; }
.actions .btn.icon-only { flex: 0 0 52px; padding: 0; }
.pick { display: grid; gap: 10px; }
.pick-head { display: flex; align-items: center; justify-content: space-between; font-weight: 800; }
.daygrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.daybtn { display: grid; justify-items: center; gap: 1px; padding: 9px 0 8px; min-height: 58px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.daybtn small { font-size: .72rem; font-weight: 700; color: var(--ink-3); }
.daybtn b { font-size: 1.05rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.daybtn.is-today { border-color: var(--cobalt); }
.daybtn.is-here { background: var(--cobalt-soft); }

.pad, .r-body, .pane, .form, .step-box, .ai-box, .pick, .ck-links, .step-edit, .settings section { grid-template-columns: minmax(0, 1fr); }

/* picker & lists inside sheets */
.pick-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.pick-row { width: 100%; display: grid; grid-template-columns: 56px minmax(0, 1fr) 24px; gap: 12px; align-items: center; padding: 6px 10px 6px 6px; border-radius: 18px; border: 0; background: var(--surface-2); color: var(--ink); text-align: left; }
.pick-row .pl { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; overflow: hidden; }
.pick-row .pl .plate-wrap { width: 46px; }
.pick-row b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.12rem; line-height: 1.15; }
.pick-row small { color: var(--ink-3); font-size: .84rem; font-weight: 600; }
.pick-row > .ic { color: var(--cobalt); }
.sub-h { margin: 6px 0 0; font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.sheet .search input { background: var(--surface-2); box-shadow: none; }

/* forms */
.form { display: grid; gap: 14px; }
.field { display: block; font-weight: 700; font-size: .9375rem; }
.field > input, .field > select, .field > textarea { display: block; margin-top: 6px; }
.field .sub { font-weight: 500; color: var(--ink-3); }
.field input, .field select, .field textarea {
  width: 100%; min-height: 48px; padding: 11px 13px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font-weight: 500;
}
.field textarea { min-height: 130px; line-height: 1.45; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--cobalt); background: var(--surface); }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 480px) { .row2 { grid-template-columns: 1fr; } .row3 { grid-template-columns: 1fr 1fr; } }
.swatches { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
.swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .06); }
.swatch[aria-checked="true"] { border-color: var(--cobalt); box-shadow: 0 0 0 3px var(--cobalt-soft); }
.toggle { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: .9375rem; }
.toggle input { width: 22px; height: 22px; accent-color: var(--cobalt); }
.step-edit { display: grid; gap: 8px; padding: 12px; border-radius: 18px; background: var(--surface-2); }

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = (o) => JSON.parse(JSON.stringify(o));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const rid = () => Math.random().toString(36).slice(2, 9);
const icon = (id, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const hash = (s) => { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) | 0; return Math.abs(h); };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wideMQ = matchMedia('(min-width: 1000px)');
const prefs = (() => {
  let p = {};
  try { p = JSON.parse(localStorage.getItem('antom.prefs') || '{}') || {}; } catch (e) { p = {}; }
  return {
    get: (k, d) => (k in p ? p[k] : d),
    set: (k, v) => { p[k] = v; try { localStorage.setItem('antom.prefs', JSON.stringify(p)); } catch (e) { /* storage unavailable */ } },
  };
})();
const okImg = (v) => typeof v === 'string' && v.length < 300000 && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/]+=*$/.test(v);
const safeUrl = (u) => (typeof u === 'string' && /^https?:\/\/[^\s"'<>]+$/i.test(u.trim()) ? u.trim() : '');
const chefkochUrl = (q) => `https://www.chefkoch.de/rs/s0/${encodeURIComponent(String(q || '').trim()).replace(/%20/g, '+')}/Rezepte.html`;

/* ---------- vocabulary ---------- */
const DAYS = [
  { k: 'mo', short: 'Mo', name: 'Montag' }, { k: 'di', short: 'Di', name: 'Dienstag' }, { k: 'mi', short: 'Mi', name: 'Mittwoch' },
  { k: 'do', short: 'Do', name: 'Donnerstag' }, { k: 'fr', short: 'Fr', name: 'Freitag' }, { k: 'sa', short: 'Sa', name: 'Samstag' },
  { k: 'so', short: 'So', name: 'Sonntag' },
];
const DAY = Object.fromEntries(DAYS.map((d) => [d.k, d]));
const SLOTS = [{ k: 'f', name: 'Frühstück' }, { k: 'h', name: 'Hauptessen' }];
const SLOT = Object.fromEntries(SLOTS.map((s) => [s.k, s]));
const CATS = [['fruehstueck', 'Frühstück'], ['haupt', 'Hauptgerichte'], ['leicht', 'Salate & Brotzeit'], ['suess', 'Süßes & Shakes']];
const CAT = Object.fromEntries(CATS);
const AISLES = [
  ['obst', 'Obst & Gemüse', 'leaf'], ['brot', 'Brot & Backwaren', 'bread'], ['kuehl', 'Kühlregal', 'milk'],
  ['fleisch', 'Fleisch & Fisch', 'fish'], ['trocken', 'Nudeln, Reis & Getreide', 'wheat'], ['konserve', 'Dosen, Gläser & Saucen', 'can'],
  ['backen', 'Backen, Nüsse & Süßes', 'nut'], ['gewuerz', 'Gewürze, Öl & Essig', 'spice'], ['tk', 'Tiefkühl', 'snow'],
  ['getraenke', 'Getränke', 'glass'], ['sonst', 'Sonstiges', 'bag'],
];
const AISLE = Object.fromEntries(AISLES.map(([k, l]) => [k, l]));
const AISLE_ICON = Object.fromEntries(AISLES.map(([k, , i]) => [k, i]));
const TINTS = ['sky', 'rose', 'butter', 'sage', 'lilac', 'berry', 'oat', 'mint', 'apricot'];
const TINT_NAME = { sky: 'Himmelblau', rose: 'Tomate', butter: 'Butter', sage: 'Salbei', lilac: 'Flieder', berry: 'Beere', oat: 'Hafer', mint: 'Minze', apricot: 'Aprikose' };
const UNIT_PL = { Dose: 'Dosen', Kugel: 'Kugeln', Zehe: 'Zehen', Scheibe: 'Scheiben', Stange: 'Stangen', Packung: 'Packungen', Rolle: 'Rollen', Knolle: 'Knollen', Topf: 'Töpfe', Glas: 'Gläser', Prise: 'Prisen' };
const COUNTABLE = new Set(['', 'Stück', 'Bund', 'Dose', 'Pck', 'Kugel', 'Topf', 'Rolle', 'Kästchen', 'Becher', 'Glas', 'Packung', 'Knolle']);
const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const MONTHS_SHORT = ['Jan.', 'Feb.', 'März', 'Apr.', 'Mai', 'Juni', 'Juli', 'Aug.', 'Sept.', 'Okt.', 'Nov.', 'Dez.'];
const FILTERS = [['alle', 'Alle'], ['fruehstueck', 'Frühstück'], ['haupt', 'Hauptgerichte'], ['leicht', 'Salate & Brotzeit'], ['suess', 'Süßes'], ['veg', 'Vegetarisch'], ['quick', 'Bis 20 Min'], ['cosori', 'Mit Cosori'], ['eigene', 'Eigene']];

/* ---------- recipes (für 2 Personen, Cosori höchstens 200 °C) ---------- */
const I = (q, u, n, s, o) => Object.assign({ q, u, n, s }, o || {});
const P = (q, u, n, o) => Object.assign({ q, u, n, s: 'gewuerz', p: 1 }, o || {});
const A = (label, c, m, sh, pre) => ({ label, c, m, sh: sh || null, pre: !!pre });

const BUILTIN = [
  { id: 'joghurt', t: 'Joghurt', pen: 'marker', cat: 'fruehstueck', name: 'Joghurt mit Obst & Knuspermüsli', time: 15,
    ing: [
      I(400, 'g', 'Naturjoghurt', 'kuehl', { x: 'oder griechischer Joghurt' }),
      I(1, '', 'Banane', 'obst', { pl: 'Bananen' }),
      I(125, 'g', 'Beeren', 'obst', { x: 'frisch oder TK' }),
      I(100, 'g', 'Haferflocken', 'trocken', { x: 'gern kernige' }),
      I(30, 'g', 'Haselnüsse', 'backen', { x: 'oder Mandeln' }),
      P(2, 'EL', 'Honig', { s: 'backen' }),
      P(1, 'EL', 'Rapsöl'),
      P(1, 'Prise', 'Zimt'),
    ],
    steps: [
      'Für das Knuspermüsli Haferflocken, grob gehackte Nüsse, 1 EL Honig, Öl und Zimt in einer Schüssel gut vermischen.',
      [A('Knuspermüsli rösten', 150, 10, 5), 'Ein passend zugeschnittenes Backpapier in den Korb legen, die Mischung flach darauf verteilen und rösten. Nach 5 Min umrühren, damit nichts zu dunkel wird.'],
      'Auf einem Teller vollständig abkühlen lassen – erst dann wird das Müsli richtig knusprig.',
      'Joghurt auf zwei Schalen verteilen. Banane in Scheiben schneiden und mit den Beeren darauf geben.',
      'Mit dem restlichen Honig beträufeln und 2–3 EL Knuspermüsli darüberstreuen.',
    ],
    tip: 'Das Knuspermüsli hält sich im Schraubglas gut zwei Wochen – am besten gleich die doppelte Menge rösten.' },

  { id: 'bircher', t: 'Bircher', pen: 'caps', cat: 'fruehstueck', name: 'Bircher-Müsli mit gerösteten Nüssen', time: 10,
    ing: [
      I(80, 'g', 'Haferflocken', 'trocken', { x: 'zarte' }),
      I(150, 'ml', 'Milch', 'kuehl'),
      I(150, 'g', 'Naturjoghurt', 'kuehl'),
      I(1, '', 'Apfel', 'obst', { pl: 'Äpfel' }),
      I(0.5, '', 'Zitrone', 'obst', { pl: 'Zitronen', x: 'Saft' }),
      I(100, 'g', 'Beeren', 'obst', { x: 'frisch oder TK' }),
      I(30, 'g', 'Haselnüsse', 'backen', { x: 'oder Mandeln' }),
      P(1, 'EL', 'Honig', { s: 'backen' }),
    ],
    steps: [
      'Am Vorabend Haferflocken mit Milch und Joghurt verrühren und abgedeckt über Nacht in den Kühlschrank stellen.',
      [A('Nüsse rösten', 160, 4, 2), 'Die Nüsse in einer kleinen ofenfesten Form in den Korb stellen und rösten, nach 2 Min schütteln. Danach grob hacken.'],
      'Morgens den Apfel mit Schale grob raspeln und sofort mit dem Zitronensaft mischen, damit er hell bleibt.',
      'Apfel und Honig unter die eingeweichten Flocken rühren. Ist das Müsli zu fest, einen Schuss Milch dazugeben.',
      'In Schalen füllen und mit Beeren und gerösteten Nüssen bestreuen.',
    ],
    tip: 'Die Nüsse gleich für mehrere Tage rösten – im Glas bleiben sie eine Woche knackig.' },

  { id: 'porridge', t: 'Porridge', pen: 'marker', cat: 'fruehstueck', name: 'Porridge mit Zimtäpfeln aus dem Cosori', time: 15,
    ing: [
      I(80, 'g', 'Haferflocken', 'trocken', { x: 'zarte' }),
      I(400, 'ml', 'Milch', 'kuehl', { x: 'oder Haferdrink' }),
      I(1, '', 'Apfel', 'obst', { pl: 'Äpfel' }),
      I(2, 'EL', 'Walnusskerne', 'backen'),
      P(1, 'EL', 'Butter', { s: 'kuehl' }),
      P(1, 'TL', 'Zimt'),
      P(2, 'TL', 'Honig', { s: 'backen', x: 'oder Ahornsirup' }),
      P(1, 'Prise', 'Salz'),
    ],
    steps: [
      'Apfel vierteln, entkernen und in Spalten schneiden. Mit geschmolzener Butter, Zimt und 1 TL Honig mischen.',
      [A('Zimtäpfel garen', 180, 8, 4), 'Apfelspalten im Korb garen, nach 4 Min schütteln, bis sie weich und leicht karamellisiert sind.'],
      'Währenddessen Haferflocken mit Milch und einer Prise Salz in einem Topf aufkochen. Bei kleiner Hitze unter Rühren 3–5 Min quellen lassen, bis ein cremiger Brei entsteht.',
      'Porridge in Schalen füllen, Zimtäpfel und gehackte Walnüsse darauf geben und mit dem restlichen Honig beträufeln.',

  BASE[d.id] = Object.assign({ b: '', note: '', sub: '', sv: 2, img: d.id, tip: '', tint: 'plain', veg: true, ck: d.t }, d, DISH_META[d.id] || {}, { steps: normSteps(d.steps), builtin: true });
}
const BUILTIN_IDS = BUILTIN.map((d) => d.id);

function dish(id) {
  const c = S.custom[id];
  if (c && c.deleted) return null;
  if (c) {
    const base = BASE[id];
    const d = Object.assign(
      { b: '', note: '', sub: '', sv: 2, tip: '', cat: 'haupt', ing: [], time: null, veg: false, ck: c.t },
      base ? { tint: base.tint, veg: base.veg, ck: base.ck } : { tint: TINTS[hash(id) % TINTS.length] },
      c,
      { id, steps: normSteps(c.steps), img: base ? base.img : null, builtin: !!base, edited: !!base },
    );
    if (!TINTS.includes(d.tint) && d.tint !== 'plain') d.tint = 'plain';
    return d;
  }
  return BASE[id] || null;
}
function allDishIds() {
  const ids = BUILTIN_IDS.filter((id) => !(S.custom[id] && S.custom[id].deleted));
  for (const id of Object.keys(S.custom)) if (!BASE[id] && !S.custom[id].deleted) ids.push(id);
  return ids;
}
const allDishes = () => allDishIds().map(dish).filter(Boolean);
const firstAf = (d) => { const s = d && d.steps.find((x) => x.af); return s ? s.af : null; };
const rotClass = (key) => 'r' + (hash(key) % 7);
function plateImg(d, big, cls = '') {
  if (d && okImg(d.thumb)) return `<span class="plate-wrap ${cls}"><img class="plate photo ${rotClass(d.id)}" src="${d.thumb}" alt=""${big ? '' : ' loading="lazy"'} draggable="false"></span>`;

  const size = big ? 'width="640" height="640"' : 'width="360" height="360" loading="lazy"';
  return `<span class="plate-wrap ${cls}"><img class="plate ${rotClass(d ? d.id : 'leer')}" src="${src}" alt="" ${size} draggable="false">${letter}</span>`;
}

/* ---------- quantities ---------- */
const FRAC = [[0.25, '¼'], [0.5, '½'], [0.75, '¾'], [1 / 3, '⅓'], [2 / 3, '⅔']];
function fmtNum(q) {
  if (q == null || !isFinite(q)) return '';
  const whole = Math.floor(q + 1e-9);
  const rest = q - whole;
  if (rest < 0.05) return String(whole);
  if (rest > 0.95) return String(whole + 1);
  for (const [v, s] of FRAC) if (Math.abs(rest - v) < 0.05) return (whole ? String(whole) : '') + s;
  return String(Math.round(q * 10) / 10).replace('.', ',');
}
function scaleQ(q, u, factor, shopping) {
  if (q == null) return null;
  let v = q * factor;
  if (u === 'g' || u === 'ml') v = v >= 100 ? Math.round(v / 10) * 10 : v >= 20 ? Math.round(v / 5) * 5 : Math.max(1, Math.round(v));
  else if (shopping && COUNTABLE.has(u || '')) v = Math.max(1, Math.ceil(v - 0.05));
  return v;
}
function amountText(q, u) {
  if (q == null) return '';
  const dec = (v) => String(Math.round(v * 10) / 10).replace('.', ',');
  if (u === 'g' && q >= 1000) return dec(q / 1000) + ' kg';
  if (u === 'ml' && q >= 1000) return dec(q / 1000) + ' l';
  const unit = !u ? '' : (q > 1 ? (UNIT_PL[u] || u) : u);
  return fmtNum(q) + (unit ? ' ' + unit : '');
}
const ingName = (i, q) => (!i.u && q != null && q > 1 && i.pl ? i.pl : i.n);
const ingKey = (i) => i.n.trim().toLowerCase() + '|' + (i.u || '');

/* ---------- state ---------- */
const emptyPlan = () => Object.fromEntries(DAYS.map((d) => [d.k, { f: [], h: [] }]));
const S = { mode: 'loading', plan: emptyPlan(), custom: {}, shop: { checked: {}, need: {}, extras: [] }, settings: { people: 2 }, dragging: false, planReady: false };
const UI = { tab: 'week', sheet: null, opener: null, query: '', filter: 'alle', shelfQuery: '', canImages: false, vtSrc: null };

function sanitizeEntry(e) {
  if (!e || typeof e !== 'object' || typeof e.d !== 'string') return null;
  const out = { u: typeof e.u === 'string' ? e.u : rid(), d: e.d };
  const s = Number(e.s);
  if (s >= 1 && s <= 20) out.s = Math.round(s);
  return out;
}
function sanitizeDay(v) {
  const o = { f: [], h: [] };
  if (v && typeof v === 'object') for (const k of ['f', 'h']) if (Array.isArray(v[k])) o[k] = v[k].map(sanitizeEntry).filter(Boolean);
  return o;
}
function sanitizePlan(p) {
  const out = emptyPlan();
  if (p && typeof p === 'object') for (const d of DAYS) out[d.k] = sanitizeDay(p[d.k]);
  return out;
}
function sanitizeShop(v) {
  const o = { checked: {}, need: {}, extras: [] };
  if (!v || typeof v !== 'object') return o;
  if (v.checked && typeof v.checked === 'object') for (const k of Object.keys(v.checked)) if (v.checked[k]) o.checked[k] = true;
  if (v.need && typeof v.need === 'object') for (const k of Object.keys(v.need)) if (v.need[k]) o.need[k] = true;
  if (Array.isArray(v.extras)) o.extras = v.extras.filter((x) => x && typeof x.t === 'string').map((x) => ({ id: String(x.id || rid()), t: x.t.slice(0, 120), done: !!x.done }));
  return o;
}
function sanitizeSettings(v) {
  const n = Number(v && v.people);
  return { people: n >= 1 && n <= 12 ? Math.round(n) : 2 };
}
function planFromStarter() {
  const p = emptyPlan();
  for (const d of DAYS) for (const s of ['f', 'h']) p[d.k][s] = STARTER[d.k][s].map((id) => ({ u: rid(), d: id }));
  return p;
}
function findEntry(uid) {
  for (const d of DAYS) for (const s of SLOTS) {
    const i = S.plan[d.k][s.k].findIndex((e) => e.u === uid);
    if (i >= 0) return { day: d.k, slot: s.k, index: i, entry: S.plan[d.k][s.k][i] };
  }
  return null;
}

/* ---------- storage: shared db when the viewer may write, else this device ---------- */
const LS_KEY = 'antom.v1';
const store = { db: null, unsub: [], queue: new Map(), lsTimer: 0 };
function lsLoad() {
  try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function lsSave() {
  clearTimeout(store.lsTimer);
  store.lsTimer = setTimeout(() => {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ plan: S.plan, custom: S.custom, shop: S.shop, settings: S.settings })); } catch (e) { /* storage unavailable */ }
  }, 150);
}
function startLocal(reason) {
  S.mode = 'local';
  S.localReason = reason || 'device';
  const saved = lsLoad();
  if (saved && saved.plan) {
    S.plan = sanitizePlan(saved.plan);
    S.custom = saved.custom && typeof saved.custom === 'object' ? saved.custom : {};
    S.shop = sanitizeShop(saved.shop);
    S.settings = sanitizeSettings(saved.settings);
  } else {
    S.plan = planFromStarter();
  }
  renderAll();
}
function startShared(db) {
  S.mode = 'shared';
  store.db = db;
  const fail = (err) => onDbError(err);
  store.unsub.push(db.collection('plan').onSnapshot((snap) => {
    const p = emptyPlan();
    for (const doc of snap.docs) if (p[doc.id]) p[doc.id] = sanitizeDay(clone(doc.data()));
    S.plan = p;
    S.planReady = true;
    queueRender('week', 'shop');
  }, fail));
  store.unsub.push(db.collection('dishes').onSnapshot((snap) => {
    const c = {};
    for (const doc of snap.docs) c[doc.id] = clone(doc.data());
    S.custom = c;
    queueRender('week', 'book', 'shop');
  }, fail));
  store.unsub.push(db.collection('meta').onSnapshot((snap) => {
    for (const doc of snap.docs) {
      if (doc.id === 'shop') S.shop = sanitizeShop(clone(doc.data()));
      if (doc.id === 'settings') S.settings = sanitizeSettings(clone(doc.data()));
    }
    queueRender('shop', 'week');
  }, fail));
  renderAll();
}
function onDbError(err) {
  const code = err && err.code;
  if (code === 'revoked' || code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed') {
    toLocal('Der Familienplan ist gerade nicht erreichbar. Änderungen bleiben auf diesem Gerät.');
  }
}
function toLocal(message) {
  if (S.mode === 'local') return;
  for (const u of store.unsub) { try { u(); } catch (e) { /* already closed */ } }
  store.unsub = [];
  S.mode = 'local';
  S.localReason = 'readonly';
  lsSave();
  renderChrome();
  if (message) toast(message);
}
function docData(path) {
  const [col, id] = path.split('/');
  if (col === 'plan') return clone(S.plan[id]);
  if (col === 'meta' && id === 'shop') return clone(S.shop);
  if (col === 'meta' && id === 'settings') return clone(S.settings);
  if (col === 'dishes') return S.custom[id] ? clone(S.custom[id]) : null;
  return undefined;
}
function persist(paths) {
  if (S.mode === 'local') { lsSave(); return; }
  if (S.mode !== 'shared') return;
  for (const p of new Set(paths)) {
    let w = store.queue.get(p);
    if (!w) store.queue.set(p, (w = { busy: false, dirty: false }));
    w.dirty = true;
    if (!w.busy) pump(p, w);
  }
}
async function pump(path, w) {
  w.busy = true;
  let retried = false;
  while (w.dirty && S.mode === 'shared') {
    w.dirty = false;
    const data = docData(path);
    if (data === undefined) continue;
    try {
      const ref = store.db.doc(path);
      if (data === null) await ref.delete(); else await ref.set(data);
      retried = false;
    } catch (e) {
      const code = e && e.code;
      if (code === 'invalid_argument' || code === 'not_granted' || code === 'revoked') {
        toLocal('Für den gemeinsamen Plan fehlen dir die Bearbeitungsrechte. Änderungen werden jetzt auf diesem Gerät gespeichert.');
        break;
      }
      if (code === 'quota_exceeded') { toast('Der Speicher ist voll. Bitte ein paar eigene Rezepte löschen.'); continue; }
      if (!retried) { retried = true; w.dirty = true; await sleep(500 + Math.random() * 900); continue; }
      toast('Speichern hat gerade nicht geklappt. Bitte gleich noch einmal versuchen.');
    }
  }
  w.busy = false;
}
const planPaths = (...days) => days.map((d) => 'plan/' + d);

/* ---------- mutations ---------- */
function snapshot() { return { plan: clone(S.plan), custom: clone(S.custom), shop: clone(S.shop) }; }
function restore(snap) {
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const paths = [];
  for (const d of DAYS) if (!same(S.plan[d.k], snap.plan[d.k])) paths.push('plan/' + d.k);
  for (const id of new Set([...Object.keys(S.custom), ...Object.keys(snap.custom)])) if (!same(S.custom[id], snap.custom[id])) paths.push('dishes/' + id);
  if (!same(S.shop, snap.shop)) paths.push('meta/shop');
  S.plan = snap.plan; S.custom = snap.custom; S.shop = snap.shop;
  persist(paths);
  renderAll();
}
function addEntry(day, slot, dishId, index) {
  const list = S.plan[day][slot];
  const at = index == null || index < 0 || index > list.length ? list.length : index;
  const entry = { u: rid(), d: dishId };
  list.splice(at, 0, entry);
  persist(planPaths(day));
  return entry.u;
}
function moveEntry(uid, day, slot, index) {
  const f = findEntry(uid);
  if (!f) return;
  S.plan[f.day][f.slot].splice(f.index, 1);
  const list = S.plan[day][slot];
  const at = index == null || index < 0 || index > list.length ? list.length : index;
  list.splice(at, 0, f.entry);
  persist(planPaths(f.day, day));
}
function removeEntry(uid) {
  const f = findEntry(uid);
  if (!f) return null;
  S.plan[f.day][f.slot].splice(f.index, 1);
  persist(planPaths(f.day));
  return f;
}

/* ---------- this week ---------- */
function weekInfo() {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const dow = (today.getDay() + 6) % 7;
  const monday = new Date(today); monday.setDate(today.getDate() - dow);
  const dates = DAYS.map((_, i) => { const x = new Date(monday); x.setDate(monday.getDate() + i); return x; });
  const thu = new Date(today); thu.setDate(today.getDate() - dow + 3);
  const jan1 = new Date(thu.getFullYear(), 0, 1);
  const kw = 1 + Math.floor(Math.round((thu - jan1) / 86400000) / 7);
  const a = dates[0], b = dates[6];
  const range = a.getMonth() === b.getMonth()
    ? `${a.getDate()}.–${b.getDate()}. ${MONTHS[b.getMonth()]}`
    : `${a.getDate()}. ${MONTHS_SHORT[a.getMonth()]} – ${b.getDate()}. ${MONTHS_SHORT[b.getMonth()]}`;
  return { kw, dates, todayIdx: dow, range };
}
const WEEK = weekInfo();
const dayDate = (k) => { const i = DAYS.findIndex((d) => d.k === k); const x = WEEK.dates[i]; return `${x.getDate()}. ${MONTHS_SHORT[x.getMonth()]}`; };

/* ---------- rendering ---------- */
const isLoading = () => S.mode === 'loading' || (S.mode === 'shared' && !S.planReady);
let renderParts = new Set();
let renderFrame = 0;
function queueRender(...parts) {
  for (const p of parts) renderParts.add(p);
  if (S.dragging || renderFrame) return;
  renderFrame = requestAnimationFrame(flushRender);
}
function flushRender() {
  renderFrame = 0;
  if (S.dragging) return;
  const parts = renderParts; renderParts = new Set();
  if (parts.has('week')) renderWeek();
  if (parts.has('book')) { renderBook(); renderShelf(); }
  if (parts.has('shop')) renderShop();
  renderChrome();
  if (UI.sheet && UI.sheet.refresh) UI.sheet.refresh();
}
function renderAll() { renderParts = new Set(['week', 'book', 'shop']); if (!S.dragging) { cancelAnimationFrame(renderFrame); flushRender(); } }

function renderChrome() {
  $('#kw').textContent = `KW ${WEEK.kw} · ${WEEK.range}`;
  const label = S.mode === 'shared' ? 'Familie' : S.mode === 'local' ? 'Dieses Gerät' : 'Verbinde …';
  for (const el of $$('.sync')) {
    el.dataset.state = S.mode;
    el.querySelector('span').textContent = label;
    el.setAttribute('aria-label', `Gespeichert: ${label}. Einstellungen öffnen`);
  }
  const open = shopCounts().open;
  for (const el of $$('[data-count]')) el.textContent = open ? String(open) : '';
  const scan = canScan();
  $('#app').classList.toggle('has-scan', scan);
  for (const el of $$('[data-scan-entry]')) el.hidden = !scan;
}

/* shelf (wide screens) */
function matches(d, q) {
  if (!q) return true;
  const hay = [d.t, d.name, d.note, d.sub, CAT[d.cat], ...(d.ing || []).map((i) => i.n)].join(' ').toLowerCase();
  return q.split(/\s+/).every((w) => hay.includes(w));
}

function cardHTML(d) {
  const af = firstAf(d);

/* shopping */
function weekItems() {
  const map = new Map();
  let dishes = 0;
  for (const day of DAYS) for (const slot of SLOTS) for (const e of S.plan[day.k][slot.k]) {
    const d = dish(e.d);
    if (!d) continue;
    dishes++;
    const factor = (e.s || S.settings.people) / (d.sv || 2);
    for (const i of d.ing || []) {
      if (!i || !i.n) continue;
      const key = ingKey(i);
      let it = map.get(key);
      if (!it) map.set(key, (it = { key, n: i.n, pl: i.pl, u: i.u || '', q: 0, hasQ: false, s: AISLE[i.s] ? i.s : 'sonst', p: !!i.p, from: new Map() }));
      if (i.q != null) { it.q += i.q * factor; it.hasQ = true; }
      it.from.set(d.t, (it.from.get(d.t) || 0) + 1);
    }
  }
  const items = [...map.values()].map((it) => Object.assign(it, { qty: it.hasQ ? scaleQ(it.q, it.u, 1, true) : null }));
  return { items, dishes };
}
function shopCounts() {
  if (isLoading()) return { open: 0 };

}
const fromText = (map) => [...map.entries()].map(([t, n]) => (n > 1 ? `${t} ×${n}` : t)).join(' · ');
const itemLine = (i) => { const a = amountText(i.qty, i.u); return `${a ? a + ' ' : ''}${ingName(i, i.qty)}`; };

function weekListText() {
  const { items } = weekItems();

function openSheet(view, opener, opts = {}) {
  const sheet = $('#sheet');
  const show = (noAnim) => {
    UI.opener = opener || document.activeElement;
    UI.sheet = view;
    sheet.className = 'sheet' + (opts.full ? ' full' : '') + (opts.cls ? ' ' + opts.cls : '') + (noAnim ? ' no-anim' : '');
    view.render();
    sheet.hidden = false;
    $('#scrim').hidden = false;
    document.documentElement.classList.add('locked');
    sheet.scrollTop = 0;
    const h = sheet.querySelector('h2');
    if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  };
  const src = opts.from;
  if (src && document.startViewTransition && !reduceMotion) {
    UI.vtSrc = src;
    src.style.viewTransitionName = 'dish-plate';
    const t = document.startViewTransition(() => {
      src.style.viewTransitionName = '';
      show(true);
      const hero = $('#sheet .r-plate img');
      if (hero) hero.style.viewTransitionName = 'dish-plate';
    });
    t.finished.finally(() => { const hero = $('#sheet .r-plate img'); if (hero) hero.style.viewTransitionName = ''; });
  } else {
    UI.vtSrc = null;
    show(false);
  }
}
function closeSheet(opts = {}) {
  const view = UI.sheet;
  if (!view) return;
  UI.sheet = null;
  if (view.onClose) view.onClose();
  const opener = UI.opener;
  const finish = () => {
    if (UI.sheet) return; // a follow-up sheet already took over
    const sheet = $('#sheet');
    sheet.hidden = true;
    sheet.innerHTML = '';
    $('#scrim').hidden = true;
    if ($('#cook').hidden) document.documentElement.classList.remove('locked');
    if (!opts.instant && opener && document.contains(opener)) opener.focus({ preventScroll: true });
  };
  const src = UI.vtSrc;
  const hero = $('#sheet .r-plate img');
  UI.vtSrc = null;
  if (!opts.instant && src && hero && document.contains(src) && document.startViewTransition && !reduceMotion) {
    hero.style.viewTransitionName = 'dish-plate';
    const t = document.startViewTransition(() => { hero.style.viewTransitionName = ''; finish(); src.style.viewTransitionName = 'dish-plate'; });

}

  if (code === 'rate_limited') return 'Claude ist gerade ausgelastet. Bitte in ein paar Minuten noch einmal versuchen.';
  if (code === 'session_expired') return 'Bitte bei Claude neu anmelden und dann noch einmal versuchen.';
  if (code === 'invalid_json') return 'Die Antwort war unvollständig. Bitte noch einmal versuchen.';

const loadImg = (src) => new Promise((resolve) => { const img = new Image(); img.onload = () => resolve(img.naturalWidth ? img : null); img.onerror = () => resolve(null); img.src = src; });
function drawScaled(img, maxEdge, square) {
  let sx = 0, sy = 0, sw = img.naturalWidth, sh = img.naturalHeight;
  if (square) { const m = Math.min(sw, sh); sx = (sw - m) / 2; sy = (sh - m) / 2; sw = m; sh = m; }
  const k = Math.min(1, maxEdge / Math.max(sw, sh));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(sw * k));
  c.height = Math.max(1, Math.round(sh * k));
  const g = c.getContext('2d');
  g.fillStyle = '#fff';
  g.fillRect(0, 0, c.width, c.height);
  g.imageSmoothingQuality = 'high';
  g.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}

// shrink until the data URL fits a database document
function fitDataUrl(img, maxEdge, maxChars) {
  let edge = maxEdge, q = 0.8;
  for (let i = 0; i < 7; i++) {
    const url = drawScaled(img, edge, false).toDataURL('image/jpeg', q);
    if (url.length <= maxChars) return url;
    edge = Math.round(edge * 0.82);
    q = Math.max(0.5, q - 0.05);
  }
  return '';
}

        st.shots.push({ file, url: URL.createObjectURL(file) });
      }
      st.cur = Math.max(0, st.shots.length - 1);
      st.status = skipped ? `Höchstens ${max} Fotos pro Rezept.` : '';
      this.render();
    },
    act(act, el) {
      if (act === 'scan-show') { st.cur = Number(el.dataset.i); this.render(); return true; }
      if (act === 'scan-del') {
        const [gone] = st.shots.splice(Number(el.dataset.i), 1);
        if (gone) URL.revokeObjectURL(gone.url);
        st.cur = Math.min(st.cur, Math.max(0, st.shots.length - 1));
        st.status = '';
        this.render();
        return true;
      }
      if (act === 'scan-go') { run(); return true; }
      if (act === 'scan-stop') { if (st.ctl) st.ctl.abort(); return true; }
      return false;
    },
    onClose() {
      if (st.ctl) st.ctl.abort();
      clearInterval(st.timer);
      for (const x of st.shots) URL.revokeObjectURL(x.url);
    },
  };
  async function run() {
    if (!sampleFn || !st.shots.length || st.busy) return;
    st.busy = true;
    st.status = SCAN_STEPS[0];
    st.ctl = new AbortController();
    const signal = st.ctl.signal;
    let step = 0;
    st.timer = setInterval(() => {
      step = Math.min(step + 1, SCAN_STEPS.length - 1);
      st.status = SCAN_STEPS[step];
      const p = $('#sheet .scan-status');
      if (p && UI.sheet === view) p.textContent = st.status;
    }, 2600);
    view.render();
    try {
      const imgs = await Promise.all(st.shots.map((x) => loadImg(x.url)));
      // phone photos are huge: send Claude a sharp but light JPEG of each
      const images = await Promise.all(st.shots.map(async (x, i) => (imgs[i] ? (await jpegBlob(drawScaled(imgs[i], 2000, false), 0.86)) || x.file : x.file)));
      if (signal.aborted) throw { code: 'cancelled' };
      const data = await sampleFn.json(scanPrompt(st.shots.length, st.hint.trim(), people), { signal, images });
      const art = data && typeof data.art === 'string' ? data.art.toLowerCase() : 'rezept';
      const draft = Object.assign(draftDefaults(people), fromClaude(data, people));
      if (art === 'nichts' || (!draft.ingPrev.length && !draft.steps.some((x) => x.t))) {
        throw { code: 'no_recipe', why: data && typeof data.grund === 'string' ? data.grund.trim().slice(0, 160) : '' };
      }
      if (!draft.t) draft.t = (draft.name || 'Neues Rezept').split(/\s+/).slice(0, 4).join(' ');
      const kind = ['rezept', 'gericht', 'name'].includes(art) ? art : 'rezept';
      const dishData = dishFromDraft(draft);
      dishData.origin = 'scan';
      const pages = imgs.map((img) => (img ? fitDataUrl(img, 1400, Math.floor(240000 / imgs.length)) : '')).filter(okImg);
      if (pages.length) dishData.photo = { kind, n: pages.length };
      if (kind === 'gericht' && imgs[0]) {
        const thumb = drawScaled(imgs[0], 360, true).toDataURL('image/jpeg', 0.8);
        if (okImg(thumb)) dishData.thumb = thumb;
      }
      finish(dishData, pages, kind);
    } catch (e) {
      st.status = e && e.code === 'no_recipe'
        ? `Auf ${st.shots.length > 1 ? 'den Fotos' : 'dem Foto'} war kein Rezept zu erkennen${e.why ? ` (${e.why})` : ''}. Am besten mit mehr Licht und dem ganzen Rezept im Bild noch einmal versuchen.`
        : claudeError(e);
    } finally {
      clearInterval(st.timer);
      st.busy = false;
      st.ctl = null;
      if (UI.sheet === view) view.render();
    }
  }
  function finish(dishData, pages, kind) {
    const id = 'c' + Date.now().toString(36) + rid().slice(0, 3);
    const before = snapshot();
    S.custom[id] = dishData;
    persist(['dishes/' + id]);
    if (pages.length) savePhoto(id, { kind, pages, at: Date.now() });
    const uid = ctx.day ? addEntry(ctx.day, ctx.slot, id, null) : null;
    renderAll();
    const back = UI.opener;
    closeSheet({ instant: true });
    openRecipe(id, { uid, fresh: true }, back);
    toast(ctx.day ? `${dishData.t} angelegt und für ${DAY[ctx.day].name} geplant` : `${dishData.t} ist jetzt im Kochbuch`, {
      undo: () => { closeSheet(); restore(before); cleanupPhotoLater(id); },
    });
  }
  openSheet(view, opener, { full: true, cls: 'scan' });
}
