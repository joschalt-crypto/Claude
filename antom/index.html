/* ---------- Cosori timer ---------- */
const T = { iv: 0, end: 0, total: 0, label: '', key: '', dishId: '', temp: 0, shakes: [], fired: new Set(), audio: null, wake: null, done: false, paused: false, left: 0, alertUntil: 0 };
function beep(times = 1) {
  try {
    if (!T.audio) T.audio = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = T.audio;
    if (ctx.state === 'suspended') ctx.resume();
    for (let i = 0; i < times; i++) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      const t0 = ctx.currentTime + i * 0.35;
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.35, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.25);
      o.connect(g).connect(ctx.destination); o.start(t0); o.stop(t0 + 0.27);
    }
  } catch (e) { /* audio unavailable */ }
  try { if (navigator.vibrate) navigator.vibrate(times > 1 ? [200, 120, 200, 120, 200] : 200); } catch (e) { /* no vibration */ }
}
async function wakeOn() { try { if (navigator.wakeLock && !T.wake) T.wake = await navigator.wakeLock.request('screen'); } catch (e) { T.wake = null; } }
function wakeOff() { if (!$('#cook').hidden || T.iv) return; try { if (T.wake) T.wake.release(); } catch (e) { /* released */ } T.wake = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && (T.iv || !$('#cook').hidden)) { T.wake = null; wakeOn(); } });
function startTimer(d, af, key) {
  try { if (!T.audio) T.audio = new (window.AudioContext || window.webkitAudioContext)(); if (T.audio.state === 'suspended') T.audio.resume(); } catch (e) { T.audio = null; }
  clearInterval(T.iv);
  Object.assign(T, { total: af.m * 60, end: Date.now() + af.m * 60000, label: `${d.t} · ${af.label || 'Cosori'}`, key, dishId: d.id, temp: af.c, shakes: shakeList(af), fired: new Set(), done: false, paused: false, alertUntil: 0 });
  T.iv = setInterval(tickTimer, 250);
  wakeOn();
  tickTimer();
  if ($('#cook').hidden) toast(`Timer läuft: ${af.m} Min bei ${af.c} °C`);
}
function pauseTimer() {
  if (!T.iv && !T.paused) return;
  if (T.paused) { T.end = Date.now() + T.left * 1000; T.paused = false; T.iv = setInterval(tickTimer, 250); }
  else { T.left = Math.max(0, (T.end - Date.now()) / 1000); T.paused = true; clearInterval(T.iv); T.iv = 0; }
  tickTimer();
}
const mmss = (sec) => { const s = Math.max(0, Math.ceil(sec)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
function timerState() {
  const left = T.paused ? T.left : (T.end - Date.now()) / 1000;
  const elapsed = T.total - left;
  const next = T.shakes.find((m) => !T.fired.has(m));
  const alert = T.alertUntil && Date.now() < T.alertUntil;
  return { left: Math.max(0, left), elapsed, next, alert };
}
function tickTimer() {
  if (!T.key) return;
  const { left, elapsed } = timerState();
  if (!T.paused && !T.done) {
    for (const m of T.shakes) if (elapsed >= m * 60 && !T.fired.has(m)) { T.fired.add(m); beep(1); T.alertUntil = Date.now() + 15000; }
    if (left <= 0) { T.done = true; beep(3); clearInterval(T.iv); T.iv = 0; }
  }
  const s = timerState();
  const info = T.done ? 'Fertig! Bitte nachsehen.' : s.alert ? 'Jetzt schütteln oder wenden!' : T.paused ? 'Pausiert' : s.next ? `Schütteln in ${mmss(s.next * 60 - s.elapsed)}` : `${T.temp} °C`;
  const pill = $('#timer');
  const showPill = $('#cook').hidden;
  pill.hidden = !showPill;
  if (showPill) {
    pill.classList.toggle('alert', !!s.alert || T.done);
    pill.innerHTML = `${plateImg({ id: 'airfryer', img: 'airfryer', t: '' }, false)}<div class="t-main" data-act="timer-open" role="button" tabindex="0" aria-label="Kochmodus öffnen"><span class="t-label">${esc(T.label)}</span><span class="t-time" role="timer">${T.done ? '0:00' : mmss(s.left)}</span><span class="t-next" aria-live="polite">${esc(info)}</span></div><div class="t-btns">${T.done ? '' : '<button type="button" data-act="timer-plus" aria-label="Eine Minute mehr">+1</button>'}<button type="button" data-act="timer-stop">${T.done ? 'OK' : 'Stopp'}</button></div>`;
  }
  const ring = $('#cook [data-ring]');
  if (ring && ring.dataset.ring === T.key) updateRing(ring, s, info);
}
function updateRing(ring, s, info) {
  const circ = 2 * Math.PI * 70;
  const prog = ring.querySelector('.prog');
  prog.style.strokeDasharray = String(circ);
  prog.style.strokeDashoffset = String(circ * (1 - (T.total ? s.left / T.total : 0)));
  ring.querySelector('.t b').textContent = T.done ? '0:00' : mmss(s.left);
  const fry = ring.closest('.fry');
  if (fry) {
    fry.classList.toggle('alert', !!s.alert || T.done);
    const lbl = fry.querySelector('[data-info]'); if (lbl) lbl.textContent = info;
    const btns = fry.querySelector('.fry-btns');
    if (btns) btns.innerHTML = T.done ? `<button type="button" data-act="timer-stop">${icon('check')}OK</button>` : `<button type="button" data-act="timer-pause">${icon(T.paused ? 'play' : 'pause', 'fill')}${T.paused ? 'Weiter' : 'Pause'}</button><button type="button" class="sec2" data-act="timer-plus">+1 Min</button>`;
  }
}
function stopTimer() {
  clearInterval(T.iv);
  Object.assign(T, { iv: 0, key: '', done: false, paused: false });
  $('#timer').hidden = true;
  wakeOff();
  if (!$('#cook').hidden) renderCook();
}

/* ---------- cook mode ---------- */
const C = { id: '', servings: 2, i: 0, ing: false };
function cookPages(d) { return [{ type: 'prep' }, ...d.steps.map((s, i) => ({ type: 'step', s, i }))]; }
function openCook(id, servings) {
  const d = dish(id);
  if (!d) return;
  Object.assign(C, { id, servings: servings || S.settings.people, i: 0, ing: false });
  const cook = $('#cook');
  cook.hidden = false;
  document.documentElement.classList.add('locked');
  renderCook();
  wakeOn();
  const btn = cook.querySelector('.cook-nav .go');
  if (btn) btn.focus({ preventScroll: true });
}
function closeCook() {
  $('#cook').hidden = true;
  $('#cook').innerHTML = '';
  if (!UI.sheet) document.documentElement.classList.remove('locked');
  wakeOff();
  if (T.key) tickTimer();
}
function renderCook() {
  const d = dish(C.id);
  if (!d) { closeCook(); return; }
  const pages = cookPages(d);
  C.i = Math.max(0, Math.min(pages.length - 1, C.i));
  const p = pages[C.i];
  const factor = C.servings / (d.sv || 2);
  let main = '';
  if (p.type === 'prep') {
    main = `<p class="cook-eyebrow">Bereitlegen · ${C.servings} ${C.servings === 1 ? 'Person' : 'Personen'}</p><h2 class="cook-title">${esc(d.t)}</h2>
      <ul class="prep">${(d.ing || []).map((i, n) => { const q = scaleQ(i.q, i.u, factor, false); return `<li><label><input type="checkbox" id="prep-${n}"><span class="q">${esc(amountText(q, i.u))}</span><span>${esc(ingName(i, q))}${i.x ? ` (${esc(i.x)})` : ''}</span></label></li>`; }).join('')}</ul>`;
  } else {
    const af = p.s.af;
    const key = `${d.id}:${p.i}`;
    const active = T.key === key;
    const sh = shakeList(af);
    main = `<p class="cook-eyebrow">Schritt ${C.i} von ${pages.length - 1}</p>
      ${af ? `<div class="fry">
        <div class="ring" data-ring="${esc(key)}"><svg viewBox="0 0 160 160" aria-hidden="true"><circle class="track" cx="80" cy="80" r="70"/><circle class="prog" cx="80" cy="80" r="70" style="stroke-dasharray:440;stroke-dashoffset:${active ? 0 : 0}"/></svg><div class="t"><b>${active ? '' : `${esc(af.m)}:00`}</b><small>Minuten</small></div></div>
        <div class="fry-info"><span class="lbl">${esc(af.label || 'Cosori')}${af.pre ? ' · vorheizen' : ''}</span><span class="temp">${esc(af.c)} °C</span><span class="lbl" data-info>${sh.length ? `Schütteln nach ${sh.join(' & ')} Min` : 'Nicht schütteln nötig'}</span>
          <div class="fry-btns">${active ? '' : `<button type="button" data-act="cook-timer" data-step="${p.i}">${icon('play', 'fill')}Timer starten</button>`}</div></div>
      </div>` : ''}
      <p class="cook-step">${esc(p.s.t)}</p>`;
  }
  $('#cook').innerHTML = `<div class="cook-top"><button type="button" class="cbtn" data-act="cook-close" aria-label="Kochmodus beenden">${icon('x')}</button><div class="segs" aria-hidden="true">${pages.map((_, i) => `<i class="${i <= C.i ? 'on' : ''}"></i>`).join('')}</div><button type="button" class="cbtn" data-act="cook-ing" aria-label="Zutaten zeigen">${icon('list')}</button></div>
    <div class="cook-main"><div class="cook-inner">${main}</div></div>
    <div class="cook-nav"><button type="button" data-act="cook-prev"${C.i === 0 ? ' disabled' : ''}>${icon('chevron-left')}Zurück</button><button type="button" class="go" data-act="cook-next">${C.i === pages.length - 1 ? `${icon('check')}Fertig` : `Weiter${icon('chevron-right')}`}</button></div>
    ${C.ing ? `<div class="cook-ing"><div class="pick-head" style="margin-bottom:8px"><span>Zutaten für ${C.servings} ${C.servings === 1 ? 'Person' : 'Personen'}</span><button type="button" class="cbtn" data-act="cook-ing" aria-label="Zutaten schließen">${icon('x')}</button></div><ul class="prep">${(d.ing || []).map((i) => { const q = scaleQ(i.q, i.u, factor, false); return `<li><label><span></span><span class="q">${esc(amountText(q, i.u))}</span><span>${esc(ingName(i, q))}</span></label></li>`; }).join('')}</ul></div>` : ''}`;
  if (T.key) tickTimer();
}
function cookAct(act, el) {
  const d = dish(C.id);
  if (act === 'cook-close') { closeCook(); return; }
  if (act === 'cook-ing') { C.ing = !C.ing; renderCook(); return; }
  if (act === 'cook-prev') { C.i--; C.ing = false; renderCook(); return; }
  if (act === 'cook-next') {
    if (C.i >= cookPages(d).length - 1) { closeCook(); toast('Guten Appetit!'); return; }
    C.i++; C.ing = false; renderCook(); return;
  }
  if (act === 'cook-timer') { const s = d.steps[Number(el.dataset.step)]; if (s && s.af) { startTimer(d, s.af, `${d.id}:${el.dataset.step}`); renderCook(); } return; }
  if (act === 'timer-pause') { pauseTimer(); return; }
  if (act === 'timer-plus') { T.end += 60000; T.left += 60; T.total += 60; tickTimer(); return; }
  if (act === 'timer-stop') { stopTimer(); return; }
}
(() => {
  let x0 = null, y0 = 0;
  const cook = $('#cook');
  cook.addEventListener('touchstart', (e) => { if (e.touches.length === 1) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; } }, { passive: true });
  cook.addEventListener('touchend', (e) => {
    if (x0 == null || C.ing) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) cookAct(dx < 0 ? 'cook-next' : 'cook-prev');
  });
})();

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const t = e.target;
  const tab = t.closest('.tabbar [data-tab], .side-nav [data-tab]');
  if (tab) { setTab(tab.dataset.tab); return; }
  if (t.closest('#scrim')) { closeSheet(); return; }
  if (t.closest('#viewer')) { closeViewer(); return; }
  const a = t.closest('[data-act]');
  if (!a) return;
  const act = a.dataset.act;
  if (act === 'undo') { const fn = undoFn; undoFn = null; $('#toast').hidden = true; if (fn) fn(); return; }
  if (act === 'timer-stop') { stopTimer(); return; }
  if (act === 'timer-plus') { T.end += 60000; T.left += 60; T.total += 60; tickTimer(); return; }
  if (act === 'timer-open') { if (T.dishId && dish(T.dishId)) { openCook(T.dishId, S.settings.people); const idx = Number(T.key.split(':')[1]); if (idx >= 0) { C.i = idx + 1; renderCook(); } } return; }
  if (a.closest('#cook')) { cookAct(act, a); return; }
  if (act === 'close') { closeSheet(); return; }
  if (a.closest('#sheet') && UI.sheet && UI.sheet.act && UI.sheet.act(act, a, e)) return;
  switch (act) {
    case 'open-dish': if (!dragGuard()) openRecipe(a.dataset.dish, null, a); return;
    case 'open-entry': if (!dragGuard()) openEntry(a.dataset.uid, a); return;
    case 'pick': openPicker(a.dataset.day, a.dataset.slot, a); return;
    case 'cook': { const f = a.dataset.uid && findEntry(a.dataset.uid); openCook(a.dataset.dish, (f && f.entry.s) || S.settings.people); return; }
    case 'goto-day': { const el = $(`#day-${a.dataset.day}`); if (el) el.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' }); return; }
    case 'filter': UI.filter = a.dataset.f; renderBook(); return;
    case 'new-dish': { const back = UI.sheet ? UI.opener : a; closeSheet({ instant: true }); openForm(null, back, { t: a.dataset.title || '' }); return; }
    case 'import': { const back = UI.sheet ? UI.opener : a; closeSheet({ instant: true }); openImport(back); return; }
    case 'scan': {
      if (!canScan()) return;
      const back = UI.sheet ? UI.opener : a;
      closeSheet({ instant: true });
      openScan(back, a.dataset.day ? { day: a.dataset.day, slot: a.dataset.slot } : {});
      return;
    }
    case 'photo-view': { const src = (photoCache.get(a.dataset.id) || [])[Number(a.dataset.i)]; if (okImg(src)) openViewer(src); return; }
    case 'suggest': if (sampleFn) openSuggest(a); return;
    case 'settings': openSettings(a); return;
    case 'clear-week': { const back = UI.sheet ? UI.opener : a; closeSheet({ instant: true }); openClearWeek(back); return; }
    case 'copy-week': copyText(weekListText(), a); return;
    case 'clear-checked': {
      const before = snapshot();
      S.shop.checked = {}; S.shop.extras = S.shop.extras.filter((x) => !x.done);
      persist(['meta/shop']); renderShop(); renderChrome();
      toast('Erledigte entfernt', { undo: () => restore(before) });
      return;
    }
    case 'need': S.shop.need[a.dataset.key] = true; persist(['meta/shop']); renderShop(); renderChrome(); return;
    case 'unneed': delete S.shop.need[a.dataset.key]; delete S.shop.checked[a.dataset.key]; persist(['meta/shop']); renderShop(); renderChrome(); return;
    case 'del-extra': S.shop.extras = S.shop.extras.filter((x) => x.id !== a.dataset.id); persist(['meta/shop']); renderShop(); renderChrome(); return;
    default:
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.matches('[data-act="toggle-item"]')) {
    if (t.checked) S.shop.checked[t.dataset.key] = true; else delete S.shop.checked[t.dataset.key];
    persist(['meta/shop']);
    setTimeout(() => { renderShop(); renderChrome(); }, t.checked && !reduceMotion ? 260 : 0);
  } else if (t.matches('[data-scan-add]')) {
    const files = Array.from(t.files || []);
    t.value = '';
    if (files.length && UI.sheet && UI.sheet.add) UI.sheet.add(files);
  } else if (t.matches('[data-act="toggle-extra"]')) {
    const x = S.shop.extras.find((i) => i.id === t.dataset.id);
    if (x) { x.done = t.checked; persist(['meta/shop']); setTimeout(() => { renderShop(); renderChrome(); }, t.checked && !reduceMotion ? 260 : 0); }
  }
});
document.addEventListener('toggle', (e) => {
  const el = e.target;
  if (el.matches && el.matches('[data-fold]')) prefs.set(el.dataset.fold, el.open);
}, true);
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'extraForm') return;
  e.preventDefault();
  const input = $('#extraInput');
  const text = input.value.trim();
  if (!text) { input.focus(); return; }
  S.shop.extras.push({ id: rid(), t: text.slice(0, 120), done: false });
  persist(['meta/shop']);
  renderShop(); renderChrome();
  const again = $('#extraInput'); if (again) again.focus();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (closeViewer()) return;
    if (!$('#cook').hidden) { if (C.ing) { C.ing = false; renderCook(); } else closeCook(); return; }
    if (UI.sheet) { closeSheet(); return; }
  }
  if (!$('#cook').hidden && (e.key === 'ArrowRight' || e.key === 'ArrowLeft') && !e.target.closest('input, textarea')) { cookAct(e.key === 'ArrowRight' ? 'cook-next' : 'cook-prev'); return; }
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t.getAttribute && t.getAttribute('role') === 'button' && t.dataset.act && t.tagName !== 'BUTTON') { e.preventDefault(); t.click(); }
});
$('#bookSearch').addEventListener('input', (e) => { UI.query = e.target.value; renderBook(); });
$('#shelfSearch').addEventListener('input', (e) => { UI.shelfQuery = e.target.value; renderShelf(); });

/* ---------- boot ---------- */
document.documentElement.lang = 'de';
buildDays();
initSortables();
setTab('week');
renderAll();

(async () => {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') { startLocal('device'); return; }
  c.use('sample').then(async (fn) => {
    sampleFn = typeof fn === 'function' ? fn : null;
    if (sampleFn && typeof sampleFn.limits === 'function') {
      try { const lim = await sampleFn.limits(); UI.canImages = !!(lim && lim.images); UI.imgLimits = (lim && lim.images) || null; } catch (e) { UI.canImages = false; }
    }
    queueRender('week', 'book');
  }).catch(() => { sampleFn = null; });
  let db = null, user = null;
  try { [db, user] = await Promise.all([c.use('db'), c.use('user').catch(() => null)]); } catch (e) { db = null; }
  if (!db) { startLocal('device'); return; }
  let can = null;
  try { can = user && typeof user.can === 'function' ? await user.can('data.write') : null; } catch (e) { can = null; }
  if (can === false) { startLocal('readonly'); return; }
  startShared(db);
})();
})();
</script>
