<title>Antom</title>
<style>
/* ---------- tokens ---------- */
:root {
  color-scheme: light;
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-serif: ui-serif, "New York", "Iowan Old Style", Charter, "Bitstream Charter", Georgia, serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --ease-sheet: cubic-bezier(.32, .72, 0, 1);

  --bg: #f2f2f7;
  --surface: #ffffff;
  --surface-2: #f2f2f7;
  --sheet-bg: #f2f2f7;
  --sheet-plain: #ffffff;
  --sheet-cell: #ffffff;
  --label: #0b0b10;
  --label-2: rgba(60, 60, 67, .66);
  --label-3: rgba(60, 60, 67, .34);
  --sep: rgba(60, 60, 67, .18);
  --fill: rgba(118, 118, 128, .12);
  --fill-2: rgba(118, 118, 128, .22);
  --seg-on: #ffffff;
  --accent: #2448cf;
  --accent-soft: rgba(36, 72, 207, .1);
  --on-accent: #ffffff;
  --heat: #d9530a;
  --heat-soft: rgba(217, 83, 10, .11);
  --ok: #1f8a3c;
  --danger: #d70015;
  --badge: #ff3b30;
  --glass: rgba(247, 247, 250, .78);
  --glass-line: rgba(0, 0, 0, .12);
  --card-shadow: 0 1px 2px rgba(20, 24, 60, .05);
  --float-shadow: 0 14px 34px -12px rgba(20, 24, 60, .32), 0 2px 8px rgba(20, 24, 60, .08);
  --scrim: rgba(0, 0, 0, .28);
  --behind: #000000;
  --hud: rgba(30, 30, 33, .95);
  --hud-ink: #ffffff;
  --hud-link: #9db0ff;
  --ph: #d8d0c4;
  --plate-ink: #26398f;
  --skeleton: rgba(118, 118, 128, .12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #000000;
    --surface: #1c1c1e;
    --surface-2: #2c2c2e;
    --sheet-bg: #1c1c1e;
    --sheet-plain: #1c1c1e;
    --sheet-cell: #2c2c2e;
    --label: #ffffff;
    --label-2: rgba(235, 235, 245, .62);
    --label-3: rgba(235, 235, 245, .3);
    --sep: rgba(84, 84, 88, .62);
    --fill: rgba(118, 118, 128, .24);
    --fill-2: rgba(118, 118, 128, .36);
    --seg-on: #636366;
    --accent: #5c7cfa;
    --accent-soft: rgba(92, 124, 250, .2);
    --on-accent: #ffffff;
    --heat: #ff8a3d;
    --heat-soft: rgba(255, 138, 61, .17);
    --ok: #32d74b;
    --danger: #ff453a;
    --badge: #ff453a;
    --glass: rgba(22, 22, 24, .74);
    --glass-line: rgba(255, 255, 255, .12);
    --card-shadow: none;
    --float-shadow: 0 14px 34px -10px rgba(0, 0, 0, .7);
    --scrim: rgba(0, 0, 0, .5);
    --hud: rgba(58, 58, 62, .96);
    --ph: #2b2824;
    --skeleton: rgba(118, 118, 128, .2);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000000;
  --surface: #1c1c1e;
  --surface-2: #2c2c2e;
  --sheet-bg: #1c1c1e;
  --sheet-plain: #1c1c1e;
  --sheet-cell: #2c2c2e;
  --label: #ffffff;
  --label-2: rgba(235, 235, 245, .62);
  --label-3: rgba(235, 235, 245, .3);
  --sep: rgba(84, 84, 88, .62);
  --fill: rgba(118, 118, 128, .24);
  --fill-2: rgba(118, 118, 128, .36);
  --seg-on: #636366;
  --accent: #5c7cfa;
  --accent-soft: rgba(92, 124, 250, .2);
  --on-accent: #ffffff;
  --heat: #ff8a3d;
  --heat-soft: rgba(255, 138, 61, .17);
  --ok: #32d74b;
  --danger: #ff453a;
  --badge: #ff453a;
  --glass: rgba(22, 22, 24, .74);
  --glass-line: rgba(255, 255, 255, .12);
  --card-shadow: none;
  --float-shadow: 0 14px 34px -10px rgba(0, 0, 0, .7);
  --scrim: rgba(0, 0, 0, .5);
  --hud: rgba(58, 58, 62, .96);
  --ph: #2b2824;
  --skeleton: rgba(118, 118, 128, .2);
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--bg); color: var(--label);
  font: 17px/1.35 var(--font-ui); letter-spacing: -.008em;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; -webkit-tap-highlight-color: transparent;
  transition: background-color .4s;
}
html.sheet-deep body { background: var(--behind); }
button, input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
img { display: block; max-width: 100%; }
h1, h2, h3, h4, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
a { color: var(--accent); text-decoration: none; }
:focus { outline: none; }
[tabindex="-1"]:focus-visible { outline: none; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; border-radius: 12px; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
.ic { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.ic.fill { fill: currentColor; stroke: none; }
.ic.sm { width: 16px; height: 16px; stroke-width: 2.1; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- app shell ---------- */
.app {
  position: fixed; inset: 0; overflow: hidden; background: var(--bg);
  transform-origin: 50% 0; transition: transform .5s var(--ease-sheet), border-radius .5s var(--ease-sheet), opacity .5s;
}
html.sheet-deep .app { transform: translateY(calc(env(safe-area-inset-top, 0px) + 10px)) scale(.92); border-radius: 14px; }
.views { position: absolute; inset: 0; }
.view {
  position: absolute; inset: 0; display: none; overflow-x: hidden; overflow-y: auto;
  overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch;
}
.app[data-tab="plan"] #v-plan, .app[data-tab="book"] #v-book, .app[data-tab="shop"] #v-shop { display: block; }
.view.enter > .view-in { animation: view-in .28s var(--ease); }
@keyframes view-in { from { opacity: 0; transform: translateY(6px); } }
.view-in { max-width: 760px; margin: 0 auto; padding: 0 16px calc(118px + env(safe-area-inset-bottom, 0px)); }

/* navigation bar with collapsing large title */
.nav { position: sticky; top: 0; z-index: 20; padding-top: env(safe-area-inset-top, 0px); }
.nav::before {
  content: ''; position: absolute; inset: 0; z-index: -1; opacity: 0; transition: opacity .22s;
  background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: .5px solid var(--glass-line);
}
.nav-row { max-width: 760px; height: 52px; margin: 0 auto; padding: 0 16px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.nav-l { justify-self: start; display: flex; gap: 8px; }
.nav-r { justify-self: end; display: flex; gap: 10px; }
.nav-title { font: 600 17px/1.2 var(--font-ui); max-width: 52vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transform: translateY(5px); transition: opacity .22s, transform .22s; }
.view.is-scrolled .nav::before, .view.is-scrolled .nav-title { opacity: 1; transform: none; }
.lt { display: flex; align-items: flex-end; gap: 12px; padding: 0 0 12px; }
.lt-text { flex: 1; min-width: 0; }
.cap { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--label-2); margin-bottom: 2px; }
.lt h1 { font: 700 34px/1.12 var(--font-display); letter-spacing: -.012em; text-wrap: balance; }
.lt-tools { display: flex; align-items: center; gap: 8px; padding-bottom: 3px; }

/* buttons */
.rbtn {
  width: 36px; height: 36px; flex: none; border-radius: 50%; display: grid; place-items: center;
  background: var(--fill); color: var(--accent); transition: transform .15s var(--ease), background .2s;
}
.rbtn:active { transform: scale(.9); }
.rbtn .ic { width: 20px; height: 20px; stroke-width: 2.1; }
.rbtn[disabled] { opacity: .35; pointer-events: none; }
.capsule .ic { width: 15px; height: 15px; stroke-width: 2.6; margin-left: -4px; }
.capsule {
  height: 32px; padding: 0 14px; border-radius: 16px; display: inline-flex; align-items: center; gap: 6px;
  background: var(--accent-soft); color: var(--accent); font-size: 15px; font-weight: 600; white-space: nowrap;
}
.btn {
  min-height: 50px; padding: 0 20px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 17px; font-weight: 600; background: var(--fill); color: var(--accent); white-space: nowrap;
  transition: transform .15s var(--ease), opacity .2s, background .2s;
}
.btn:active { transform: scale(.97); }
.btn .ic { width: 20px; height: 20px; stroke-width: 2.1; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.heat { background: var(--heat); color: #fff; }
.btn.danger { color: var(--danger); }
.btn.small { min-height: 38px; padding: 0 16px; border-radius: 19px; font-size: 15px; }
.btn.wide { width: 100%; }
.btn.white { background: #fff; color: #0b0b10; }
.btn.glassy { background: rgba(255, 255, 255, .2); color: #fff; border: .5px solid rgba(255, 255, 255, .32); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.link { color: var(--accent); font-size: 17px; font-weight: 400; padding: 8px 2px; }
.link.b { font-weight: 600; }
.link[disabled] { opacity: .4; pointer-events: none; }

/* grouped lists */
.group { background: var(--surface); border-radius: 14px; overflow: hidden; box-shadow: var(--card-shadow); }
.row { position: relative; display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 11px 16px; text-align: left; background: var(--surface); }
.row + .row::before, .group > * + .row::before { content: ''; position: absolute; top: 0; left: var(--inset, 16px); right: 0; border-top: .5px solid var(--sep); }
button.row:active, .row[role="button"]:active { background: var(--fill); }
.row .grow { flex: 1; min-width: 0; }
.row .val { color: var(--label-2); margin-left: auto; text-align: right; }
.row .chev { width: 16px; height: 16px; color: var(--label-3); stroke-width: 2.4; }
.row.danger { color: var(--danger); }
.row.accent { color: var(--accent); }
.row-ic { width: 30px; height: 30px; flex: none; border-radius: 8px; display: grid; place-items: center; color: #fff; background: var(--tile, var(--accent)); }
.row-ic .ic { width: 18px; height: 18px; stroke-width: 2.1; }
.sec-h { font-size: 13px; font-weight: 500; letter-spacing: .02em; text-transform: uppercase; color: var(--label-2); padding: 0 16px 7px; margin-top: 28px; }
.sec-f { font-size: 13px; line-height: 1.4; color: var(--label-2); padding: 8px 16px 0; }
.sec-title { font: 700 22px/1.2 var(--font-display); letter-spacing: -.01em; margin: 30px 0 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec-title small { font: 400 15px var(--font-ui); color: var(--label-2); }

/* photos */
.ph { position: relative; overflow: hidden; background: var(--ph); }
.ph > img, .thumb > img { width: 100%; height: 100%; object-fit: cover; }
.mono {
  position: absolute; left: 50%; top: 47%; transform: translate(-50%, -50%); pointer-events: none;
  font: 600 var(--mono, 22px)/1 var(--font-serif); color: var(--plate-ink); opacity: .82;
}
.thumb { position: relative; width: 56px; height: 56px; flex: none; border-radius: 12px; overflow: hidden; background: var(--ph); --mono: 20px; }
.skeleton { background: var(--skeleton) !important; border-radius: 14px; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }

/* ---------- week ---------- */
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); margin: 0 -6px 16px; }
.dp { display: grid; justify-items: center; gap: 3px; padding: 4px 0; border-radius: 14px; }
.dp small { font-size: 12px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--label-2); }
.dp b { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font: 600 19px/1 var(--font-display); font-variant-numeric: tabular-nums; transition: background .2s, transform .15s; }
.dp:active b { transform: scale(.9); background: var(--fill); }
.dp.is-past b { color: var(--label-2); }
.dp.is-today b { background: var(--accent); color: var(--on-accent); }
.dp.is-today small { color: var(--accent); }
.dots { display: flex; gap: 4px; height: 6px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--label-3); }
.dots i.h { background: var(--accent); }

/* today hero */
#today { margin-bottom: 6px; }
.hero {
  position: relative; display: block; width: 100%; aspect-ratio: 1 / 1; max-height: 520px; border-radius: 24px; overflow: hidden;
  background: var(--ph); color: #fff; box-shadow: var(--float-shadow); isolation: isolate; text-align: left; cursor: pointer;
}
.hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; transition: transform .8s var(--ease); }
.hero:hover > img { transform: scale(1.025); }
.hero::after { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(0, 0, 0, .3) 0%, rgba(0, 0, 0, 0) 24%, rgba(0, 0, 0, 0) 42%, rgba(0, 0, 0, .74) 100%); }
.hero .mono { --mono: 96px; top: 40%; z-index: -1; }
.hero-top { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.gpill {
  height: 30px; padding: 0 12px; border-radius: 15px; display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 600; letter-spacing: .01em; color: #fff;
  background: rgba(255, 255, 255, .2); border: .5px solid rgba(255, 255, 255, .3);
  -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%);
}
.gpill .ic { width: 15px; height: 15px; stroke-width: 2.2; }
.hero-body { position: absolute; left: 20px; right: 20px; bottom: 18px; display: grid; gap: 6px; }
.hero-title { font: 700 clamp(30px, 8.6vw, 40px)/1.06 var(--font-serif); letter-spacing: -.01em; text-wrap: balance; text-shadow: 0 1px 14px rgba(0, 0, 0, .3); }
.hero-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 15px; font-weight: 500; color: rgba(255, 255, 255, .9); }
.hero-meta span { display: inline-flex; align-items: center; gap: 5px; }
.hero-meta .ic { width: 16px; height: 16px; }
.hero-actions { display: flex; gap: 10px; margin-top: 10px; }
.hero-actions .btn { min-height: 46px; padding: 0 18px; border-radius: 23px; }
.hero-actions .btn.white { color: #0b0b10; }
.hero.empty::after { background: linear-gradient(180deg, rgba(0, 0, 0, 0) 30%, rgba(0, 0, 0, .66) 100%); }
.hero-sub { margin-top: 12px; }
.hero-sub .row { min-height: 60px; --inset: 76px; }
.hero-sub .thumb { width: 44px; height: 44px; border-radius: 10px; --mono: 16px; }
.hero-sub .add-meal { min-height: 60px; padding: 8px 16px; }
.hero-sub .add-meal .thumb .ic { width: 20px; height: 20px; }
.mini-txt { flex: 1; min-width: 0; display: grid; }
.mini-txt small { font-size: 13px; color: var(--label-2); }
.mini-txt b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* days */
.day { margin-top: 24px; scroll-margin-top: calc(60px + env(safe-area-inset-top, 0px)); }
.day-h { display: flex; align-items: center; gap: 8px; padding: 0 4px 8px; min-height: 36px; }
.day-h h3 { font: 700 20px/1.2 var(--font-display); letter-spacing: -.01em; }
.day-h .date { font-size: 15px; color: var(--label-2); }
.day-h .tag { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 8px; }
.day-h .add { margin-left: auto; width: 32px; height: 32px; }
.day-h .add .ic { width: 18px; height: 18px; }
.day.is-past .slot { opacity: .62; }
.day.is-past .day-h h3 { color: var(--label-2); }
.slot { position: relative; background: var(--surface); min-height: 4px; }
.group.days-g { overflow: hidden; }
.meal, .add-meal {
  position: relative; display: flex; align-items: center; gap: 14px; width: 100%; min-height: 78px;
  padding: 11px 14px 11px 11px; background: var(--surface); text-align: left; cursor: pointer;
  -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
}
.meal:active { background: var(--fill); }
.slot > * + *::before, .slot + .slot > :first-child::before { content: ''; position: absolute; top: 0; left: 81px; right: 0; border-top: .5px solid var(--sep); }
.meal-txt { flex: 1; min-width: 0; display: grid; gap: 1px; }
.meal-txt small { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--label-2); }
.meal-txt b { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 14px; color: var(--label-2); }
.meta span { display: inline-flex; align-items: center; gap: 4px; }
.meta .ic { width: 15px; height: 15px; stroke-width: 2; }
.meta .heat { color: var(--heat); }
.fav-dot { color: #ff375f; display: inline-flex; }
.fav-dot .ic { width: 14px; height: 14px; }
.meal > .chev, .row > .chev { width: 16px; height: 16px; color: var(--label-3); stroke-width: 2.4; }
.add-meal .thumb { background: none; border: 1.5px dashed var(--label-3); display: grid; place-items: center; color: var(--accent); }
.add-meal .thumb .ic { width: 22px; height: 22px; stroke-width: 2.2; }
.add-meal b { font-size: 17px; font-weight: 500; color: var(--accent); }
.meal.gone .thumb { display: grid; place-items: center; color: var(--label-2); background: var(--fill); }
.plan-foot { margin-top: 8px; }

/* drag and drop */
.is-ghost { opacity: .35; }
.is-fallback { opacity: .97 !important; border-radius: 16px; box-shadow: 0 22px 44px -14px rgba(0, 0, 0, .45); transform: scale(1.03); }
html.is-dragging, html.is-dragging * { cursor: grabbing !important; }
.trash {
  position: fixed; z-index: 45; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); transform: translateX(-50%);
  min-width: 260px; min-height: 58px; padding: 0 22px; border-radius: 29px; display: flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--hud); color: #fff; font-weight: 600; box-shadow: var(--float-shadow); transition: background .2s, transform .2s;
}
.trash.is-over { background: #ff3b30; transform: translateX(-50%) scale(1.06); }
.trash .meal { display: none; }

/* desktop shelf */
.shelf { display: none; }
.shelf-row { display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; border-radius: 14px; cursor: grab; background: var(--surface); }
.shelf-row + .shelf-row { margin-top: 2px; }
.shelf-row:hover { background: var(--fill); }
.shelf-row .thumb { width: 44px; height: 44px; border-radius: 10px; --mono: 16px; }
.shelf-row span:not(.thumb) { flex: 1; min-width: 0; display: grid; }
.shelf-row b { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shelf-row small { font-size: 13px; color: var(--label-2); }
.shelf-row .ic { color: var(--label-3); }

/* ---------- cookbook ---------- */
.search { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 12px; background: var(--fill); color: var(--label-2); }
.search .ic { width: 18px; height: 18px; stroke-width: 2.2; }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; color: var(--label); font-size: 17px; outline: none; }
.search input::placeholder { color: var(--label-2); }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 12px -16px 0; padding: 0 16px 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; height: 34px; padding: 0 14px; border-radius: 17px; display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface); color: var(--label); font-size: 15px; font-weight: 500; box-shadow: inset 0 0 0 .5px var(--sep), var(--card-shadow);
  transition: background .2s, color .2s;
}
.chip .ic { width: 15px; height: 15px; }
.chip[aria-pressed="true"] { background: var(--label); color: var(--bg); box-shadow: none; }
.promo {
  position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; min-height: 300px; margin-top: 18px; padding: 16px 20px 20px; border-radius: 24px;
  overflow: hidden; isolation: isolate; color: #fff; background: #3b3530; box-shadow: var(--float-shadow);
}
.promo > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
.promo::after { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(14, 16, 30, .12) 0%, rgba(14, 16, 30, .3) 38%, rgba(14, 16, 30, .86) 100%); }
.promo .gpill { align-self: flex-start; margin-left: -4px; }

.promo-body { display: grid; }
.promo .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

.hscroll { display: grid; grid-auto-flow: column; grid-auto-columns: 150px; gap: 12px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 6px; scroll-snap-type: x mandatory; scroll-padding: 0 16px; scrollbar-width: none; }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 12px; }

.fav-badge { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: rgba(0, 0, 0, .3); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }

.empty { display: grid; justify-items: center; gap: 14px; padding: 34px 12px; text-align: center; color: var(--label-2); }

.empty .acts { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }

/* ---------- shopping ---------- */
.sum { display: flex; align-items: center; gap: 16px; padding: 16px; }
.ring { position: relative; width: 58px; height: 58px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 6; }

.ring b { position: absolute; inset: 0; display: grid; place-items: center; font: 700 15px/1 var(--font-round); font-variant-numeric: tabular-nums; }

.sum-txt { flex: 1; min-width: 0; display: grid; gap: 2px; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); padding: 2px; border-radius: 10px; background: var(--fill); }
.seg button { min-height: 34px; padding: 0 8px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; font-weight: 600; color: var(--label); white-space: nowrap; transition: background .2s, box-shadow .2s; }
.seg button .ic { width: 17px; height: 17px; }
.seg button[aria-selected="true"], .seg button[aria-checked="true"] { background: var(--seg-on); box-shadow: 0 2px 6px rgba(0, 0, 0, .1), 0 0 0 .5px rgba(0, 0, 0, .04); }
.add-item { display: flex; align-items: center; gap: 12px; padding: 4px 6px 4px 14px; min-height: 52px; }
.add-item .plus { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--accent); flex: none; }
.add-item .plus .ic { width: 16px; height: 16px; stroke-width: 2.6; }
.add-item input { flex: 1; min-width: 0; height: 44px; border: 0; background: none; outline: none; font-size: 17px; color: var(--label); }

.aisle-h { display: flex; align-items: center; gap: 10px; margin: 26px 4px 8px; font-size: 17px; font-weight: 700; }
.tile { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: #fff; background: var(--tile, #8e8e93); flex: none; }

.item { position: relative; display: flex; align-items: center; gap: 13px; min-height: 54px; padding: 10px 16px; cursor: pointer; }
.item + .item::before { content: ''; position: absolute; top: 0; left: 55px; right: 0; border-top: .5px solid var(--sep); }

.check { width: 26px; height: 26px; flex: none; border-radius: 50%; border: 1.8px solid var(--label-3); display: grid; place-items: center; transition: background .2s, border-color .2s, transform .25s var(--ease); }

.mini { width: 34px; height: 34px; flex: none; border-radius: 50%; display: grid; place-items: center; color: var(--label-2); }

.mini .ic { width: 18px; height: 18px; }
.fold { margin-top: 26px; }
.fold > summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 6px 4px 8px; font-size: 17px; font-weight: 700; cursor: pointer; }

.fold > summary .chev { width: 16px; height: 16px; color: var(--label-2); stroke-width: 2.6; transition: transform .2s; }
.fold[open] > summary .chev { transform: rotate(90deg); }
.pantry { display: flex; flex-wrap: wrap; gap: 8px; }
.pchip { height: 38px; padding: 0 14px 0 10px; border-radius: 19px; display: inline-flex; align-items: center; gap: 6px; font-size: 15px; background: var(--surface); box-shadow: inset 0 0 0 .5px var(--sep), var(--card-shadow); }

.shop-empty { margin-top: 18px; border-radius: 24px; overflow: hidden; position: relative; aspect-ratio: 4 / 3; display: grid; align-content: end; padding: 20px; color: #fff; isolation: isolate; }
.shop-empty > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
.shop-empty::after { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(0, 0, 0, 0) 35%, rgba(0, 0, 0, .7) 100%); }

/* ---------- tab bar ---------- */

  position: absolute; z-index: 30; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));

}

.count { position: absolute; top: -2px; left: calc(50% + 7px); min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; background: var(--badge); font-variant-numeric: tabular-nums; }

/* ---------- sheets ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); animation: fade .35s var(--ease); }

@keyframes fade-out { to { opacity: 0; } }
.sheet {
  --surface: var(--sheet-cell);
  position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-height: calc(100% - env(safe-area-inset-top, 0px) - 30px);
  overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  background: var(--sheet-bg); border-radius: 16px 16px 0 0; box-shadow: 0 -10px 40px -16px rgba(0, 0, 0, .3);
  padding-bottom: env(safe-area-inset-bottom, 0px);

}

.sheet.no-anim { animation: none; }
.sheet.out { animation: sheet-down .32s var(--ease) forwards; }
.sheet.dragging { transition: none; animation: none; }
.sheet.settle { transition: transform .35s var(--ease-sheet); }
@keyframes sheet-up { from { transform: translateY(100%); } }
@keyframes sheet-down { to { transform: translateY(100%); } }
.grabber { width: 38px; height: 5px; border-radius: 3px; background: var(--fill-2); margin: 6px auto 0; }
.sh-head { position: sticky; top: 0; z-index: 5; background: inherit; }

.sheet.is-scrolled .sh-head::after { opacity: 1; }
.sh-bar { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; min-height: 50px; padding: 0 16px; }
.sh-bar h2 { font: 600 17px/1.25 var(--font-ui); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sh-bar .l { justify-self: start; }
.sh-bar .r { justify-self: end; }
.xbtn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--label-2); }
.xbtn .ic { width: 15px; height: 15px; stroke-width: 2.8; }
.pad { padding: 8px 16px 28px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.lead { font-size: 17px; line-height: 1.45; color: var(--label-2); }
.big-title { font: 700 28px/1.15 var(--font-display); letter-spacing: -.01em; text-wrap: balance; }
.status { min-height: 22px; font-size: 15px; color: var(--label-2); }
.status:empty { display: none; }
.status.busy::before { content: ''; display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px; border: 2px solid var(--fill-2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.acts-col { display: grid; gap: 10px; }
.acts-row { display: flex; flex-wrap: wrap; gap: 10px; }

/* recipe */
.r-top {
  position: sticky; top: 0; z-index: 6; height: 60px; margin-bottom: -60px; padding: 12px 14px 0;
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: start; gap: 10px;
}
.r-top::before { content: ''; position: absolute; inset: 0; z-index: -1; opacity: 0; transition: opacity .22s; background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: .5px solid var(--glass-line); }
.r-top-t { padding-top: 8px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .22s; }
.r-top-r { display: flex; gap: 10px; }
.gbtn {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff;
  background: rgba(0, 0, 0, .28); border: .5px solid rgba(255, 255, 255, .22); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%);
  transition: background .22s, color .22s, transform .15s;
}
.gbtn:active { transform: scale(.9); }
.gbtn .ic { width: 19px; height: 19px; stroke-width: 2.2; }
.gbtn.on { color: #ff375f; }
.sheet.is-scrolled .r-top::before, .sheet.is-scrolled .r-top-t { opacity: 1; }

.r-hero { position: relative; height: min(58vh, 520px); min-height: 280px; overflow: hidden; background: var(--ph); }

.r-body { position: relative; margin-top: -22px; padding: 22px 18px 24px; border-radius: 22px 22px 0 0; background: var(--sheet-plain); display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.r-eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }
.r-title { font: 700 32px/1.1 var(--font-serif); letter-spacing: -.012em; text-wrap: balance; margin-top: -8px; }
.r-name { font-size: 17px; color: var(--label-2); margin-top: -8px; }
.r-note { display: flex; gap: 8px; align-items: center; font-size: 15px; color: var(--label-2); }

.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-block: .5px solid var(--sep); padding: 12px 0; }
.fact { display: grid; justify-items: center; align-content: start; gap: 4px; text-align: center; padding: 0 6px; }

.stepper { display: inline-flex; align-items: center; gap: 10px; }

.hist { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--label-2); }
.hist .ic { width: 17px; height: 17px; }
.fresh { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); color: var(--label); font-size: 15px; line-height: 1.4; }

.r-seg { margin-top: 4px; }
.pane { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.pane-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.pane-h h3 { font: 700 20px/1.2 var(--font-display); }

.ing { display: grid; }
.ing li { display: grid; grid-template-columns: 6.6em minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 11px 0; border-bottom: .5px solid var(--sep); font-size: 17px; cursor: pointer; transition: opacity .2s; }

.fry-sum { display: flex; gap: 14px; align-items: center; padding: 12px; border-radius: 18px; color: #fff; background: #17171a; }
.fry-sum .thumb { width: 64px; height: 64px; border-radius: 12px; }
.fry-sum h3 { font-size: 15px; font-weight: 700; }
.fry-sum p, .fry-sum li { font-size: 14px; color: rgba(255, 255, 255, .75); }
.fry-sum ol { display: grid; gap: 2px; margin-top: 2px; }
.fry-sum b { color: #ff9a57; font-weight: 600; }
.steps { display: grid; gap: 4px; counter-reset: st; }
.steps > li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; padding: 12px 0; counter-increment: st; }
.steps > li::before { content: counter(st); font: 700 24px/1.1 var(--font-serif); color: var(--accent); text-align: center; }
.steps p { font-size: 17px; line-height: 1.5; }
.af-card { display: grid; gap: 10px; padding: 14px; border-radius: 16px; background: var(--heat-soft); }
.chips-row { display: flex; flex-wrap: wrap; gap: 6px; }
.tchip { height: 28px; padding: 0 10px; border-radius: 14px; display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; background: var(--surface); color: var(--label); }
.tchip.hot { background: var(--heat); color: #fff; }
.tchip .ic { width: 14px; height: 14px; stroke-width: 2.2; }
.timer-btn { justify-self: start; min-height: 40px; padding: 0 16px; border-radius: 20px; display: inline-flex; align-items: center; gap: 8px; background: var(--heat); color: #fff; font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
.timer-btn .ic { width: 16px; height: 16px; }
.tip { display: flex; gap: 12px; padding: 14px; border-radius: 16px; background: var(--surface-2); font-size: 15px; line-height: 1.45; }
.sheet.plain .tip { background: var(--fill); }
.tip .ic { color: #e0a100; flex: none; }
.orig { display: flex; flex-wrap: wrap; gap: 10px; }
.orig-btn { width: 104px; height: 132px; border-radius: 12px; overflow: hidden; background: var(--fill); }
.orig-btn img { width: 100%; height: 100%; object-fit: cover; }
.orig-skel { width: 104px; height: 132px; border-radius: 12px; background: var(--skeleton); animation: pulse 1.4s infinite; }
.links .row { --inset: 60px; }
.links .row b { display: block; font-weight: 500; }
.links .row small { display: block; font-size: 13px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet.plain .links { background: var(--surface-2); }
.sheet.plain .links .row { background: transparent; }
.r-bar {
  position: sticky; bottom: 0; z-index: 6; margin: 0 -18px -24px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--glass-line);
}
.r-acts { display: flex; gap: 10px; }
.r-acts .btn { flex: 1; min-width: 0; padding: 0 14px; }

.pick { display: grid; gap: 12px; }
.pick-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

.pick-week { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 15px; font-weight: 600; }
.pick-week .rbtn { width: 32px; height: 32px; }
.daygrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.daybtn { display: grid; justify-items: center; gap: 2px; padding: 8px 0; border-radius: 14px; background: var(--fill); }
.daybtn small { font-size: 12px; font-weight: 600; color: var(--label-2); text-transform: uppercase; }

.daybtn:active { transform: scale(.94); }

/* picker */
.quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.qtile { display: grid; justify-items: center; gap: 6px; padding: 14px 6px; border-radius: 16px; background: var(--surface); font-size: 14px; font-weight: 600; text-align: center; color: var(--label); box-shadow: var(--card-shadow); }
.qtile .q-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fff; background: var(--tile, var(--accent)); }
.qtile .q-ic .ic { width: 21px; height: 21px; stroke-width: 2.1; }
.qtile:active { transform: scale(.96); }
.pick-row { --inset: 74px; min-height: 64px; }
.pick-row .thumb { width: 46px; height: 46px; border-radius: 10px; --mono: 16px; }
.pick-row .plus { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.pick-row .plus .ic { width: 16px; height: 16px; stroke-width: 2.6; }
.sub-h { font-size: 13px; font-weight: 500; letter-spacing: .02em; text-transform: uppercase; color: var(--label-2); padding: 0 16px; margin: 6px 0 -8px; }

/* forms */
.form { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
.field { display: block; font-size: 13px; font-weight: 500; letter-spacing: .02em; text-transform: uppercase; color: var(--label-2); }
.field .opt { text-transform: none; letter-spacing: 0; font-weight: 400; }
.field input, .field textarea, .field select, .input {
  display: block; width: 100%; margin-top: 7px; padding: 12px 14px; border-radius: 12px; border: 0;
  background: var(--surface); color: var(--label); font-size: 17px; text-transform: none; letter-spacing: -.008em; font-weight: 400;
  box-shadow: inset 0 0 0 .5px var(--sep); outline: none; transition: box-shadow .2s;
}
.field textarea { min-height: 120px; resize: vertical; line-height: 1.45; }
.field select { -webkit-appearance: none; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--label-2) 50%), linear-gradient(135deg, var(--label-2) 50%, transparent 50%); background-position: calc(100% - 20px) 55%, calc(100% - 14px) 55%; background-size: 6px 6px; background-repeat: no-repeat; }
.field input:focus, .field textarea:focus, .field select:focus, .input:focus { box-shadow: inset 0 0 0 2px var(--accent); }
.row2, .row3 { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.row3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 8px 16px; border-radius: 12px; background: var(--surface); font-size: 17px; cursor: pointer; }
.toggle input { -webkit-appearance: none; appearance: none; position: relative; width: 51px; height: 31px; flex: none; margin: 0; border-radius: 16px; background: var(--fill-2); cursor: pointer; transition: background .25s; }
.toggle input::after { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, .15), 0 1px 1px rgba(0, 0, 0, .16); transition: transform .25s var(--ease); }
.toggle input:checked { background: #34c759; }
.toggle input:checked::after { transform: translateX(20px); }
.toggle.mini { min-height: 0; padding: 0; background: none; font-size: 15px; gap: 10px; justify-content: flex-start; }
.toggle.mini input { transform: scale(.82); transform-origin: left center; }
.step-edit { display: grid; gap: 10px; padding: 12px; border-radius: 16px; background: var(--surface); box-shadow: var(--card-shadow); }
.step-edit textarea { width: 100%; min-height: 84px; padding: 10px 12px; border: 0; border-radius: 10px; background: var(--fill); color: var(--label); font-size: 16px; line-height: 1.45; resize: vertical; outline: none; }
.step-edit textarea:focus { box-shadow: inset 0 0 0 2px var(--accent); }
.step-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.af-fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.af-fields .field input { padding: 10px 12px; background: var(--fill); box-shadow: none; }
.af-fields .wide { grid-column: 1 / -1; }
.ai-box { display: grid; gap: 12px; padding: 16px; border-radius: 18px; background: linear-gradient(135deg, var(--accent-soft), var(--heat-soft)); }
.ai-box > p { font-size: 15px; line-height: 1.45; color: var(--label-2); }
.ai-box > p b { color: var(--label); display: inline-flex; gap: 6px; align-items: center; }
.ai-box .field input { background: var(--surface); }
.copy-fallback { width: 100%; min-height: 260px; padding: 14px; border: 0; border-radius: 14px; background: var(--surface); color: var(--label); font: 15px/1.5 var(--font-ui); }

/* scan */
.sheet.scan { background: #0c0c0e; color: #f4f4f6; --surface: #1c1c1e; --label: #f4f4f6; --label-2: rgba(235, 235, 245, .62); --fill: rgba(118, 118, 128, .3); --sep: rgba(84, 84, 88, .6); display: flex; flex-direction: column; }
.scan-top { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; align-items: center; padding: 12px 14px 8px; }
.scan-top h2 { text-align: center; font-size: 17px; font-weight: 600; }
.scan-count { text-align: right; font-size: 13px; color: rgba(255, 255, 255, .6); font-variant-numeric: tabular-nums; }
.cbtn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: rgba(255, 255, 255, .14); }
.cbtn .ic { width: 18px; height: 18px; stroke-width: 2.4; }
.scan-for { margin: 0 16px 8px; display: inline-flex; align-self: center; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 15px; font-size: 13px; font-weight: 600; background: rgba(255, 255, 255, .12); }
.scan-for .ic { width: 15px; height: 15px; }
.scan-stage { position: relative; flex: 1; min-height: 300px; margin: 0 16px; border-radius: 22px; overflow: hidden; background: #000; display: grid; place-items: center; }
.scan-stage > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .42; filter: saturate(.9); }
.scan-photo { position: relative; max-width: 100%; max-height: 100%; object-fit: contain; }
.scan-empty { position: relative; display: grid; justify-items: center; gap: 12px; padding: 24px; text-align: center; color: rgba(255, 255, 255, .92); }
.scan-empty .ic { width: 40px; height: 40px; stroke-width: 1.6; }
.scan-empty p { max-width: 30ch; font-size: 15px; line-height: 1.45; }
.scan-kinds { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.scan-kinds span { padding: 5px 10px; border-radius: 13px; font-size: 13px; background: rgba(255, 255, 255, .16); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.viewfinder i { position: absolute; width: 34px; height: 34px; border: 3px solid rgba(255, 255, 255, .9); }
.viewfinder i:nth-child(1) { top: 16px; left: 16px; border-right: 0; border-bottom: 0; border-radius: 12px 0 0 0; }
.viewfinder i:nth-child(2) { top: 16px; right: 16px; border-left: 0; border-bottom: 0; border-radius: 0 12px 0 0; }
.viewfinder i:nth-child(3) { bottom: 16px; left: 16px; border-right: 0; border-top: 0; border-radius: 0 0 0 12px; }
.viewfinder i:nth-child(4) { bottom: 16px; right: 16px; border-left: 0; border-top: 0; border-radius: 0 0 12px 0; }
.scan-stage.busy::after { content: ''; position: absolute; left: 0; right: 0; height: 30%; top: -30%; background: linear-gradient(180deg, rgba(92, 124, 250, 0), rgba(92, 124, 250, .45)); animation: sweep 1.8s ease-in-out infinite; }
@keyframes sweep { to { top: 100%; } }
.scan-strip { display: flex; gap: 10px; padding: 12px 16px 0; overflow-x: auto; }
.scan-thumb { position: relative; width: 58px; height: 74px; flex: none; }
.scan-thumb .pick { width: 100%; height: 100%; border-radius: 10px; overflow: hidden; opacity: .65; display: block; }
.scan-thumb.on .pick { opacity: 1; box-shadow: 0 0 0 2px #fff; }
.scan-thumb img { width: 100%; height: 100%; object-fit: cover; }
.scan-thumb .del { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #000; background: #fff; }
.scan-thumb .del .ic { width: 12px; height: 12px; stroke-width: 3; }
.scan-add { width: 58px; height: 74px; flex: none; border-radius: 10px; border: 1.5px dashed rgba(255, 255, 255, .5); display: grid; place-items: center; align-content: center; gap: 2px; font-size: 12px; color: rgba(255, 255, 255, .85); cursor: pointer; }
.scan-add .ic { width: 20px; height: 20px; }
.scan-hint { padding: 12px 16px 0; }
.scan-hint input { background: rgba(255, 255, 255, .1); box-shadow: none; color: #fff; }
.scan-status { min-height: 22px; padding: 10px 20px 0; text-align: center; font-size: 15px; color: rgba(255, 255, 255, .78); }
.scan-actions { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 14px 16px 22px; }
.scan-side { display: grid; justify-items: center; gap: 6px; font-size: 13px; color: rgba(255, 255, 255, .85); cursor: pointer; }
.scan-side.left { justify-self: start; }
.scan-side.right { justify-self: end; }
.bubble { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .14); color: #fff; }
.shutter-wrap { display: grid; justify-items: center; gap: 8px; font-size: 13px; color: rgba(255, 255, 255, .85); cursor: pointer; }
.shutter { width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; display: grid; place-items: center; }
.shutter::after { content: ''; width: 60px; height: 60px; border-radius: 50%; background: #fff; transition: transform .15s; }
.shutter-wrap:active .shutter::after { transform: scale(.88); }
.scan-go, .scan-cancel { grid-column: 1 / -1; min-height: 54px; border-radius: 27px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 17px; }
.scan-go { background: #fff; color: #0b0b10; }
.scan-cancel { background: rgba(255, 255, 255, .14); color: #fff; }

/* import */
.step-box { display: grid; gap: 12px; padding: 16px; border-radius: 18px; background: var(--surface); box-shadow: var(--card-shadow); }
.step-box h3 { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; }
.step-box .num { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 700; color: var(--on-accent); background: var(--accent); }
.search-row { display: flex; gap: 10px; }
.search-row input { flex: 1; min-width: 0; margin: 0; background: var(--fill); box-shadow: none; }
.fine { font-size: 13px; line-height: 1.4; color: var(--label-2); }
.drop { display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: 14px; border: 1.5px dashed var(--label-3); cursor: pointer; color: var(--accent); font-weight: 600; }
.drop small { color: var(--label-2); font-weight: 400; }
.drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.thumbs img { width: 70px; height: 90px; object-fit: cover; border-radius: 10px; }
.imp-hero { height: 150px; border-radius: 20px; overflow: hidden; }
.imp-hero img { width: 100%; height: 100%; object-fit: cover; }

/* suggestions */
.sug { --inset: 78px; min-height: 70px; }
.sug .thumb { width: 50px; height: 50px; border-radius: 12px; --mono: 18px; }
.sug .grow b { display: block; font-weight: 600; }
.sug .grow small { display: block; font-size: 13px; color: var(--label-2); }
.sug .day-tag { display: block; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }

/* settings */
.about { display: grid; justify-items: center; gap: 8px; padding: 6px 0 4px; text-align: center; }
.appicon { width: 76px; height: 76px; border-radius: 22.4%; box-shadow: 0 6px 18px -6px rgba(20, 30, 90, .45); }
.about h2 { font: 700 24px/1.2 var(--font-display); }
.about p { font-size: 15px; color: var(--label-2); }
.rules { display: grid; gap: 0; }
.rules li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; padding: 11px 16px; font-size: 15px; line-height: 1.42; position: relative; }
.rules li + li::before { content: ''; position: absolute; top: 0; left: 52px; right: 0; border-top: .5px solid var(--sep); }
.rules li::marker { content: none; }
.rules .n { font: 700 15px/1.42 var(--font-round); color: var(--heat); text-align: center; }
.set-stepper { display: flex; align-items: center; gap: 14px; }
.set-stepper output { min-width: 2em; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }

/* confirm (action sheet) */
.confirm-ic { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; margin: 4px auto 0; color: var(--danger); background: color-mix(in srgb, var(--danger) 14%, transparent); }
.confirm-ic .ic { width: 30px; height: 30px; }
.confirm-t { text-align: center; }
.confirm-t h2 { font: 700 22px/1.25 var(--font-display); text-wrap: balance; }
.confirm-t p { margin-top: 6px; font-size: 15px; line-height: 1.45; color: var(--label-2); }

/* ---------- cook mode ---------- */
.cook { position: fixed; inset: 0; z-index: 70; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; color: #fff; background: #0b0b0d; isolation: isolate; overflow: hidden; }
.cook-bg { position: absolute; inset: -60px; z-index: -1; background-size: cover; background-position: center; filter: blur(46px) saturate(1.2) brightness(.36); transform: scale(1.1); }
.cook-top { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; align-items: center; gap: 14px; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 8px; }
.segs { display: flex; gap: 4px; }
.segs i { flex: 1; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .22); transition: background .3s; }
.segs i.on { background: #fff; }
.cook-main { overflow-y: auto; display: flex; flex-direction: column; padding: 8px 24px; }
.cook-inner { width: 100%; max-width: 640px; margin: auto; display: grid; gap: 20px; padding: 16px 0; }
.cook-eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: rgba(255, 255, 255, .62); }
.cook-title { font: 700 clamp(30px, 8vw, 44px)/1.08 var(--font-serif); text-wrap: balance; }
.cook-step { font: 500 clamp(24px, 6.4vw, 34px)/1.32 var(--font-serif); text-wrap: pretty; }
.prep { display: grid; gap: 2px; }
.prep label { display: grid; grid-template-columns: 30px 5.2em minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px 4px; border-bottom: .5px solid rgba(255, 255, 255, .14); font-size: 19px; cursor: pointer; }
.prep input { -webkit-appearance: none; appearance: none; width: 28px; height: 28px; margin: 0; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .45); display: grid; place-items: center; cursor: pointer; transition: background .2s, border-color .2s; }
.prep input::after { content: ''; width: 7px; height: 13px; margin-top: -3px; border: solid #0b0b10; border-width: 0 3px 3px 0; transform: rotate(45deg) scale(0); transition: transform .2s var(--ease); }
.prep input:checked { background: #fff; border-color: #fff; }
.prep input:checked::after { transform: rotate(45deg) scale(1); }
.prep .q { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.prep input:checked ~ span { opacity: .4; text-decoration: line-through; }
.fry { display: flex; align-items: center; gap: 22px; padding: 18px; border-radius: 24px; background: rgba(255, 255, 255, .08); border: .5px solid rgba(255, 255, 255, .12); }
.fry.alert { background: rgba(255, 138, 61, .25); border-color: rgba(255, 138, 61, .5); animation: throb 1.2s ease-in-out infinite; }
@keyframes throb { 50% { background: rgba(255, 138, 61, .4); } }
.ring-big { position: relative; width: 156px; height: 156px; flex: none; }
.ring-big svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-big circle { fill: none; stroke-width: 10; }
.ring-big .track { stroke: rgba(255, 255, 255, .14); }
.ring-big .prog { stroke: #ff8a3d; stroke-linecap: round; transition: stroke-dashoffset .3s linear; }
.ring-big .t { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring-big .t b { font: 700 38px/1 var(--font-round); font-variant-numeric: tabular-nums; }
.ring-big .t small { font-size: 13px; color: rgba(255, 255, 255, .62); margin-top: 4px; }
.fry-info { display: grid; gap: 6px; min-width: 0; }
.fry-info .lbl { font-size: 15px; color: rgba(255, 255, 255, .75); }
.fry-info .temp { font: 700 34px/1 var(--font-round); color: #ffb07a; }
.fry-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.fry-btns button { min-height: 44px; padding: 0 16px; border-radius: 22px; display: inline-flex; align-items: center; gap: 8px; font-weight: 700; background: #fff; color: #0b0b10; }
.fry-btns button.sec2 { background: rgba(255, 255, 255, .16); color: #fff; }
.fry-btns .ic { width: 16px; height: 16px; }
.cook-nav { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 12px; padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
.cook-nav button { min-height: 58px; border-radius: 29px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 18px; font-weight: 700; background: rgba(255, 255, 255, .14); color: #fff; }
.cook-nav .go { background: #fff; color: #0b0b10; }
.cook-nav button[disabled] { opacity: .35; }
.cook-ing { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; max-height: 74%; overflow-y: auto; padding: 18px 20px calc(env(safe-area-inset-bottom, 0px) + 20px); border-radius: 24px 24px 0 0; background: #1c1c1e; animation: sheet-up .45s var(--ease-sheet); }
.cook-ing .ih { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-weight: 700; }

/* ---------- timer, toast, viewer ---------- */
.timer {
  position: fixed; z-index: 35; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 76px); transform: translateX(-50%);
  width: min(94vw, 440px); display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 26px;
  background: #0d0d10; color: #fff; border: .5px solid rgba(255, 255, 255, .1); box-shadow: var(--float-shadow); animation: toast-in .4s var(--ease);
}
.timer.alert { background: #c2410c; animation: throb-t 1.2s ease-in-out infinite; }
@keyframes throb-t { 50% { background: #ea580c; } }
.timer .thumb { width: 44px; height: 44px; border-radius: 18px; }
.t-main { flex: 1; min-width: 0; display: grid; cursor: pointer; }
.t-label { font-size: 12px; color: rgba(255, 255, 255, .7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-time { font: 700 24px/1.1 var(--font-round); font-variant-numeric: tabular-nums; }
.t-next { font-size: 12px; color: rgba(255, 255, 255, .8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-btns { display: flex; gap: 6px; }
.t-btns button { min-height: 40px; min-width: 44px; padding: 0 12px; border-radius: 20px; font-weight: 700; font-size: 15px; background: rgba(255, 255, 255, .16); color: #fff; }
.t-btns button:last-child { background: #fff; color: #0b0b10; }
.toast {
  position: fixed; z-index: 90; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 86px); transform: translateX(-50%);
  width: max-content; max-width: min(92vw, 520px); display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 18px; min-height: 50px;
  border-radius: 25px; background: var(--hud); color: var(--hud-ink); font-size: 15px; font-weight: 500; box-shadow: var(--float-shadow);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); animation: toast-in .38s var(--ease);
}
.toast span { min-width: 0; }
.toast button { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 16px; font-weight: 700; color: var(--hud-link); }
.toast button .ic { width: 17px; height: 17px; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 16px) scale(.96); } }
.viewer { position: fixed; inset: 0; z-index: 95; display: grid; place-items: center; padding: 20px; background: rgba(0, 0, 0, .92); animation: fade .25s; }
.viewer img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; }
.viewer .cbtn { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 14px; }

/* ---------- onboarding ---------- */
.onboard { position: fixed; inset: 0; z-index: 85; display: grid; grid-template-rows: minmax(0, 1fr) auto; background: var(--sheet-plain); animation: fade .4s; }
.onboard.out { animation: ob-out .45s var(--ease) forwards; }
@keyframes ob-out { to { opacity: 0; transform: scale(1.04); } }
.ob-pages { display: grid; grid-auto-flow: column; grid-auto-columns: 100%; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.ob-pages::-webkit-scrollbar { display: none; }
.ob-page { display: grid; grid-template-rows: minmax(0, 1fr) auto; scroll-snap-align: start; scroll-snap-stop: always; min-height: 0; }
.ob-photo { position: relative; overflow: hidden; background: var(--ph); }
.ob-photo img { width: 100%; height: 100%; object-fit: cover; }
.ob-photo::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 34%; background: linear-gradient(180deg, transparent, var(--sheet-plain)); }
.ob-text { padding: 0 28px 4px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.ob-text h2 { font: 700 30px/1.1 var(--font-serif); letter-spacing: -.012em; text-wrap: balance; max-width: 18ch; }
.ob-text p { font-size: 17px; line-height: 1.45; color: var(--label-2); max-width: 32ch; text-wrap: pretty; }
.ob-brand { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.ob-brand img { width: 26px; height: 26px; border-radius: 7px; }
.ob-foot { display: grid; gap: 16px; padding: 18px 24px calc(env(safe-area-inset-bottom, 0px) + 22px); }

  .shelf h2 { font: 700 20px/1.2 var(--font-display); }

  .trash, .toast { bottom: 28px; }
  .timer { bottom: 24px; left: calc(50% + 130px); }
  .toast { left: calc(50% + 130px); }
}

const FRAC = [[0.25, '¼'], [0.5, '½'], [0.75, '¾'], [1 / 3, '⅓'], [2 / 3, '⅔']];
function fmtNum(q) {
  if (q == null || !isFinite(q)) return '';
  const whole = Math.floor(q + 1e-9);
  const rest = q - whole;
  if (rest < 0.05) return String(whole);
  if (rest > 0.95) return String(whole + 1);
  for (const [v, s] of FRAC) if (Math.abs(rest - v) < 0.05) return (whole ? String(whole) : '') + s;
  return String(Math.round(q * 10) / 10).replace('.', ',');
}
function scaleQ(q, u, factor, shopping) {
  if (q == null) return null;
  let v = q * factor;
  if (u === 'g' || u === 'ml') v = v >= 100 ? Math.round(v / 10) * 10 : v >= 20 ? Math.round(v / 5) * 5 : Math.max(1, Math.round(v));
  else if (shopping && COUNTABLE.has(u || '')) v = Math.max(1, Math.ceil(v - 0.05));
  return v;
}
function amountText(q, u) {
  if (q == null) return '';
  const dec = (v) => String(Math.round(v * 10) / 10).replace('.', ',');
  if (u === 'g' && q >= 1000) return dec(q / 1000) + ' kg';
  if (u === 'ml' && q >= 1000) return dec(q / 1000) + ' l';

let HIST = null;

  const m = new Map();
  for (const k of Object.keys(S.days).sort()) {

      if (!h) m.set(e.d, (h = { last: '', next: '', n90: 0, dates: [] }));

async function migrateShared() {
  if (Object.keys(S.days).length || !store.db) return;
  let snap = null;

  const docs = (snap && snap.docs) || [];

  for (const doc of docs) old[doc.id] = clone(doc.data());

  const paths = Object.keys(days).map((k) => 'days/' + k);
  const wk = weekKey(monday);
  if (S.legacyShop && !S.shops[wk]) { S.shops[wk] = S.legacyShop; paths.push('shop/' + wk); }

function onDbError(err) {

function toLocal(message) {

function docData(path) {
  const [col, id] = path.split('/');

  if (col === 'shop') { const v = S.shops[id]; return v && (Object.keys(v.checked).length || Object.keys(v.need).length || v.extras.length) ? clone(v) : null; }
  if (col === 'meta' && id === 'settings') return clone(S.settings);

function persist(paths) {

  if (S.mode !== 'shared') return;
  for (const p of new Set(paths)) {
    let w = store.queue.get(p);

async function pump(path, w) {

    w.dirty = false;
    const data = docData(path);
    if (data === undefined) continue;
    try {
      const ref = store.db.doc(path);
      if (data === null) await ref.delete(); else await ref.set(data);
      retried = false;
    } catch (e) {
      const code = e && e.code;
      if (code === 'invalid_argument' || code === 'not_granted' || code === 'revoked') {
        toLocal('Für den gemeinsamen Plan fehlen dir die Bearbeitungsrechte. Änderungen werden jetzt auf diesem Gerät gespeichert.');
        break;

      if (code === 'quota_exceeded') { toast('Der Speicher ist voll. Bitte ein paar eigene Rezepte löschen.'); continue; }
      if (!retried) { retried = true; w.dirty = true; await sleep(500 + Math.random() * 900); continue; }
      toast('Speichern hat gerade nicht geklappt. Bitte gleich noch einmal versuchen.');

/* shopping */
function shopDays() {
  const tk = todayKey();
  const cur = isCurWeek();
  return weekDays(UI.week).filter((d) => !(cur && UI.shopRange === 'rest' && d.key < tk));
}
function weekItems() {
  const map = new Map();
  let dishes = 0;
  for (const day of shopDays()) for (const slot of SLOTS) for (const e of dayPlan(day.key)[slot.k]) {
    const d = dish(e.d);
    if (!d) continue;
    dishes++;
    const factor = (e.s || S.settings.people) / (d.sv || 2);
    for (const i of d.ing || []) {
      if (!i || !i.n) continue;
      const key = ingKey(i);
      let it = map.get(key);
      if (!it) map.set(key, (it = { key, n: i.n, pl: i.pl, u: i.u || '', q: 0, hasQ: false, s: AISLE[i.s] ? i.s : 'sonst', p: !!i.p, from: new Map() }));
      if (i.q != null) { it.q += i.q * factor; it.hasQ = true; }
      it.from.set(d.t, (it.from.get(d.t) || 0) + 1);
    }
  }
  const items = [...map.values()].map((it) => Object.assign(it, { qty: it.hasQ ? scaleQ(it.q, it.u, 1, true) : null }));
  return { items, dishes };
}
function shopCounts() {
  if (isLoading()) return { open: 0 };
  const sh = shopOf(weekKey(UI.week));
  const { items } = weekItems();
  return { open: items.filter((i) => (!i.p || sh.need[i.key]) && !sh.checked[i.key]).length + sh.extras.filter((x) => !x.done).length };
}
const fromText = (map) => [...map.entries()].map(([t, n]) => (n > 1 ? `${t} ×${n}` : t)).join(' · ');
const itemLine = (i) => { const a = amountText(i.qty, i.u); return `${a ? a + ' ' : ''}${ingName(i, i.qty)}`; };
function itemHTML(i, done) {
  return `<label class="item${done ? ' done' : ''}"><input type="checkbox" data-act="toggle-item" data-key="${esc(i.key)}"${done ? ' checked' : ''}><span class="check">${icon('check')}</span><span class="item-txt"><span class="nm">${esc(ingName(i, i.qty))}</span><span class="from">${esc(fromText(i.from))}</span></span><span class="qty">${esc(amountText(i.qty, i.u))}</span>${i.p ? `<button type="button" class="mini" data-act="unneed" data-key="${esc(i.key)}" aria-label="${esc(i.n)} zurück in den Vorrat">${icon('undo')}</button>` : ''}</label>`;
}
function extraHTML(x) {
  return `<label class="item${x.done ? ' done' : ''}"><input type="checkbox" data-act="toggle-extra" data-id="${esc(x.id)}"${x.done ? ' checked' : ''}><span class="check">${icon('check')}</span><span class="item-txt"><span class="nm">${esc(x.t)}</span></span><button type="button" class="mini" data-act="del-extra" data-id="${esc(x.id)}" aria-label="${esc(x.t)} löschen">${icon('x')}</button></label>`;
}
function ringHTML(done, total) {
  const r = 24, c = 2 * Math.PI * r;
  const p = total ? done / total : 0;
  const inner = total && done === total ? icon('check') : done ? Math.round(p * 100) + '%' : icon('basket');
  return `<div class="ring${total && done === total ? ' done' : ''}" aria-hidden="true"><svg viewBox="0 0 58 58"><circle class="tr" cx="29" cy="29" r="${r}"/><circle class="pr" cx="29" cy="29" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - p)).toFixed(1)}"/></svg><b>${inner}</b></div>`;
}
function renderShop() {
  const box = $('#shop');
  const active = document.activeElement;
  const keep = active && active.id === 'extraInput' ? { v: active.value, at: active.selectionStart } : null;
  $('#shopCap').textContent = `KW ${isoWeek(UI.week).kw} · ${weekRange(UI.week)}`;
  $('#shopTools').innerHTML = weekToolsHTML();
  $('#shopNavL').innerHTML = todayBtnHTML();
  if (isLoading()) { box.innerHTML = '<div class="group skeleton" style="height:90px"></div>'; return; }
  const wk = weekKey(UI.week);
  const sh = shopOf(wk);
  const { items, dishes } = weekItems();
  const regular = items.filter((i) => !i.p || sh.need[i.key]);
  const pantry = items.filter((i) => i.p && !sh.need[i.key]).sort((a, b) => a.n.localeCompare(b.n, 'de'));
  const open = regular.filter((i) => !sh.checked[i.key]);
  const done = regular.filter((i) => sh.checked[i.key]);
  const xOpen = sh.extras.filter((x) => !x.done), xDone = sh.extras.filter((x) => x.done);
  const total = regular.length + sh.extras.length, doneN = done.length + xDone.length, openN = total - doneN;
  const cur = isCurWeek();
  const rangeTxt = cur && UI.shopRange === 'rest' ? 'ab heute' : 'für die ganze Woche';
  let html = `<div class="group"><div class="sum">${ringHTML(doneN, total)}<div class="sum-txt"><b>${openN ? `${openN} offen` : total ? 'Alles erledigt' : 'Nichts zu kaufen'}</b><small>${plural(dishes, 'Gericht', 'Gerichte')} ${rangeTxt} · ${persons(S.settings.people)}</small></div></div>${cur ? `<div class="seg-wrap"><div class="seg" role="tablist" aria-label="Zeitraum"><button type="button" role="tab" data-act="shop-range" data-r="rest" aria-selected="${UI.shopRange === 'rest'}">Ab heute</button><button type="button" role="tab" data-act="shop-range" data-r="week" aria-selected="${UI.shopRange !== 'rest'}">Ganze Woche</button></div></div>` : ''}</div>`;
  html += `<form class="group add-item" id="extraForm" style="margin-top:14px"><span class="plus" aria-hidden="true">${icon('plus')}</span><label class="vh" for="extraInput">Eigenen Artikel hinzufügen</label><input id="extraInput" maxlength="120" placeholder="Artikel hinzufügen, z. B. Kaffee" autocomplete="off" enterkeyhint="done"></form>`;
  if (xOpen.length) html += `<h2 class="aisle-h"><span class="tile" style="--tile:var(--accent)">${icon('bag')}</span>Eigene Artikel<em>${xOpen.length}</em></h2><div class="group">${xOpen.map(extraHTML).join('')}</div>`;
  for (const [k, label] of AISLES) {
    const list = open.filter((i) => i.s === k).sort((a, b) => a.n.localeCompare(b.n, 'de'));
    if (!list.length) continue;
    html += `<h2 class="aisle-h"><span class="tile" style="--tile:${AISLE_COLOR[k]}">${icon(AISLE_ICON[k])}</span>${esc(label)}<em>${list.length}</em></h2><div class="group">${list.map((i) => itemHTML(i, false)).join('')}</div>`;
  }
  if (!open.length && !xOpen.length) {
    html += `<div class="shop-empty">${imgOf('ob-einkauf', 'm', ' loading="lazy"')}<h2>${total ? 'Alles im Korb' : 'Noch nichts zu kaufen'}</h2><p>${total ? 'Schönen Einkauf gehabt – alles ist abgehakt.' : 'Plant Gerichte für die Woche, dann landen die Zutaten automatisch hier, sortiert nach Abteilung.'}</p></div>`;
  }
  if (doneN) {
    html += `<details class="fold"${prefs.get('doneOpen', false) ? ' open' : ''} data-fold="doneOpen"><summary>${icon('chevron-right', 'chev')}Erledigt <small>${doneN}</small></summary><div class="group">${xDone.map(extraHTML).join('')}${done.map((i) => itemHTML(i, true)).join('')}</div><div style="margin-top:12px"><button class="btn small" type="button" data-act="clear-checked">${icon('trash')}Erledigte entfernen</button></div></details>`;
  }
  if (pantry.length) {
    html += `<details class="fold"${prefs.get('pantryOpen', false) ? ' open' : ''} data-fold="pantryOpen"><summary>${icon('chevron-right', 'chev')}Vorrat <small>${pantry.length} · meist zu Hause</small></summary><p class="fine" style="margin:0 4px 10px">Tippt an, was fehlt – dann kommt es auf die Liste.</p><div class="pantry">${pantry.map((i) => `<button type="button" class="pchip" data-act="need" data-key="${esc(i.key)}" aria-label="${esc(i.n)} fehlt – auf die Liste">${icon('plus')}${esc(i.n)}</button>`).join('')}</div></details>`;
  }
  box.innerHTML = html;
  if (keep) {
    const input = $('#extraInput');
    input.value = keep.v;
    input.focus({ preventScroll: true });
    try { input.setSelectionRange(keep.at, keep.at); } catch (e) { /* not a text field */ }
  }
}
function weekListText() {
  const { items } = weekItems();
  const sh = shopOf(weekKey(UI.week));
  const days = shopDays();
  const span = days.length === 7 ? `KW ${isoWeek(UI.week).kw}` : `${days[0] ? days[0].short : ''}–So, KW ${isoWeek(UI.week).kw}`;
  const lines = [`Einkaufsliste ${span}`];
  const extras = sh.extras.filter((x) => !x.done);
  if (extras.length) { lines.push('', 'Eigene Artikel'); for (const x of extras) lines.push('• ' + x.t); }
  for (const [k, label] of AISLES) {
    const list = items.filter((i) => i.s === k && (!i.p || sh.need[i.key]) && !sh.checked[i.key]);
    if (!list.length) continue;
    lines.push('', label);
    for (const i of list.sort((a, b) => a.n.localeCompare(b.n, 'de'))) lines.push('• ' + itemLine(i));
  }
  return lines.length > 1 ? lines.join('\n') : '';
}

/* ---------- drag & drop ---------- */
const sortables = { slots: [], shelf: null, trash: null };
let lastDragEnd = 0;
const HAS_SORTABLE = typeof window.Sortable === 'function';
const dragGuard = () => Date.now() - lastDragEnd < 400;
const dragBase = {
  animation: reduceMotion ? 0 : 200,
  easing: 'cubic-bezier(.2, .8, .2, 1)',
  delay: 320,
  delayOnTouchOnly: true,
  touchStartThreshold: 6,
  forceFallback: true,
  fallbackOnBody: true,
  fallbackTolerance: 4,
  ghostClass: 'is-ghost',
  chosenClass: 'is-chosen',
  dragClass: 'is-drag',
  fallbackClass: 'is-fallback',
  scroll: true,
  scrollSensitivity: 90,
  scrollSpeed: 14,
  bubbleScroll: true,
  emptyInsertThreshold: 24,
};
function onDragStart(evt) {
  S.dragging = true;
  document.documentElement.classList.add('is-dragging');
  if (evt.from.classList.contains('slot')) $('#trash').hidden = false;
  haptic(14);
}
function onDragEnd(evt) {
  S.dragging = false;
  lastDragEnd = Date.now();
  document.documentElement.classList.remove('is-dragging');
  const trash = $('#trash');
  trash.hidden = true;
  trash.classList.remove('is-over');
  const from = evt.from, to = evt.to, item = evt.item;
  const fromSlot = from.classList.contains('slot');
  const toSlot = to.classList.contains('slot');
  let at = 0;
  for (let el = item.previousElementSibling; el; el = el.previousElementSibling) if (el.classList.contains('meal')) at++;
  if (!fromSlot) {
    if (to !== from && item.parentNode === to) item.remove();
    if (toSlot && item.dataset.dish) {
      const before = snapshot();
      addEntry(to.dataset.date, to.dataset.slot, item.dataset.dish, at);
      const d = dish(item.dataset.dish);
      toast(`${d ? d.t : 'Gericht'}: ${dayName(to.dataset.date)}, ${SLOT[to.dataset.slot].name}`, { undo: () => restore(before) });
    }
    setTimeout(renderAll, 0);
    return;
  }
  const uid = item.dataset.uid;
  if (to === trash) {
    item.remove();
    const before = snapshot();
    const f = removeEntry(uid);
    if (f) { const d = dish(f.entry.d); toast(`${d ? d.t : 'Gericht'} vom Plan genommen`, { undo: () => restore(before) }); }
    setTimeout(renderAll, 0);
    return;
  }
  if (toSlot && uid && (to !== from || evt.oldDraggableIndex !== evt.newDraggableIndex)) {
    moveEntry(uid, to.dataset.date, to.dataset.slot, at);
    haptic(8);
  }
  setTimeout(renderAll, 0);
}
function destroySlotSortables() {
  for (const s of sortables.slots) { try { s.destroy(); } catch (e) { /* gone */ } }
  sortables.slots = [];
}
function initSlotSortables() {
  if (!HAS_SORTABLE) return;
  for (const el of $$('#days .slot')) {
    sortables.slots.push(window.Sortable.create(el, Object.assign({}, dragBase, {
      group: { name: 'plan', pull: true, put: true },
      draggable: '.meal',
      filter: '.add-meal, .skeleton',
      preventOnFilter: false,
      onStart: onDragStart,

    })));

}
function initSortables() {
  if (!HAS_SORTABLE) return;

  sortables.shelf = window.Sortable.create($('#shelfList'), Object.assign({}, dragBase, {

function setTab(tab) {

  if (UI.tab === tab) { if (view.scrollTop > 0) view.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' }); return; }
  UI.tab = tab;
  $('#app').dataset.tab = tab;
  for (const b of $$('.tabbar [data-tab], .side-nav [data-tab]')) b.setAttribute('aria-selected', b.dataset.tab === tab ? 'true' : 'false');
  view.classList.remove('enter'); void view.offsetWidth; view.classList.add('enter');
  onViewScroll(view);
}
function onViewScroll(v) {
  const h1 = v.querySelector('.lt h1');

/* ---------- sheets ---------- */
let closeTimer = 0;
function openSheet(view, opener, opts = {}) {
  const sheet = $('#sheet');
  clearTimeout(closeTimer);
  const show = (noAnim) => {
    UI.opener = opener || document.activeElement;
    UI.sheet = view;
    UI.sheetOpts = opts;
    sheet.className = 'sheet' + (opts.full ? ' full' : '') + (opts.plain ? ' plain' : '') + (opts.cls ? ' ' + opts.cls : '') + (noAnim ? ' no-anim' : '');
    sheet.style.transform = '';
    view.render();
    sheet.hidden = false;
    const scrim = $('#scrim');
    scrim.hidden = false;
    scrim.classList.remove('out');
    document.documentElement.classList.add('locked');
    document.documentElement.classList.toggle('sheet-deep', !!opts.full && phoneMQ.matches);
    sheet.scrollTop = 0;
    sheet.classList.remove('is-scrolled');
    const h = sheet.querySelector('h2');
    if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  };
  const src = opts.from;
  if (src && document.startViewTransition && !reduceMotion) {
    UI.vtSrc = src;
    src.style.viewTransitionName = 'dish-photo';
    const t = document.startViewTransition(() => {
      src.style.viewTransitionName = '';
      show(true);
      const hero = $('#sheet .r-hero img');
      if (hero) hero.style.viewTransitionName = 'dish-photo';
    });
    t.finished.finally(() => { const hero = $('#sheet .r-hero img'); if (hero) hero.style.viewTransitionName = ''; });
  } else {
    UI.vtSrc = null;
    show(false);
  }
}
function closeSheet(opts = {}) {
  const view = UI.sheet;
  if (!view) return;
  UI.sheet = null;
  if (view.onClose) view.onClose();
  const opener = UI.opener;
  const sheet = $('#sheet');
  const finish = () => {
    if (UI.sheet) return; // a follow-up sheet already took over
    sheet.hidden = true;
    sheet.innerHTML = '';
    sheet.className = 'sheet';
    sheet.style.transform = '';
    $('#scrim').hidden = true;
    if ($('#cook').hidden && $('#onboard').hidden) document.documentElement.classList.remove('locked');
    if (!opts.instant && opener && document.contains(opener)) opener.focus({ preventScroll: true });
  };
  document.documentElement.classList.remove('sheet-deep');
  const src = UI.vtSrc;
  const hero = $('#sheet .r-hero img');
  UI.vtSrc = null;
  if (opts.instant) { finish(); return; }
  if (src && hero && document.contains(src) && document.startViewTransition && !reduceMotion && sheet.scrollTop < 40) {
    hero.style.viewTransitionName = 'dish-photo';
    const t = document.startViewTransition(() => { hero.style.viewTransitionName = ''; finish(); src.style.viewTransitionName = 'dish-photo'; });
    t.finished.finally(() => { src.style.viewTransitionName = ''; });
    return;
  }
  if (reduceMotion) { finish(); return; }
  sheet.classList.add('out');
  $('#scrim').classList.add('out');

// swipe a sheet down to dismiss it (phones)
(() => {
  const sheet = $('#sheet');
  let y0 = 0, x0 = 0, dy = 0, t0 = 0, armed = false, dragging = false;
  sheet.addEventListener('touchstart', (e) => {
    if (!phoneMQ.matches || e.touches.length !== 1 || sheet.classList.contains('scan')) { armed = false; return; }
    if (e.target.closest('input, textarea, select, .hscroll, .daygrid, .scan-strip')) { armed = false; return; }
    armed = sheet.scrollTop <= 0;
    dragging = false;
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; dy = 0; t0 = Date.now();
  }, { passive: true });
  sheet.addEventListener('touchmove', (e) => {
    if (!armed) return;
    const y = e.touches[0].clientY - y0, x = e.touches[0].clientX - x0;
    if (!dragging) {
      if (y > 8 && y > Math.abs(x) * 1.2 && sheet.scrollTop <= 0) { dragging = true; sheet.classList.add('dragging'); }
      else if (Math.abs(y) > 8 || Math.abs(x) > 8) { armed = false; return; }
    }
    if (dragging) {
      e.preventDefault();
      dy = Math.max(0, y);
      sheet.style.transform = `translateY(${dy}px)`;
    }
  }, { passive: false });
  sheet.addEventListener('touchend', () => {
    if (!dragging) { armed = false; return; }
    dragging = false; armed = false;
    sheet.classList.remove('dragging');
    const v = dy / Math.max(1, Date.now() - t0);
    if (dy > 140 || v > 0.6) {
      sheet.style.transition = 'transform .28s cubic-bezier(.2,.8,.2,1)';
      sheet.style.transform = 'translateY(105%)';
      setTimeout(() => { sheet.style.transition = ''; closeSheet({ swiped: true }); }, 260);
      $('#scrim').classList.add('out');
      document.documentElement.classList.remove('sheet-deep');
    } else {
      sheet.classList.add('settle');
      sheet.style.transform = '';
      setTimeout(() => sheet.classList.remove('settle'), 360);
    }
  });
})();

function confirmDelete(id, opener) {

        }
        if (BASE[id]) S.custom[id] = { deleted: true }; else delete S.custom[id];
        if (S.favs[id]) { delete S.favs[id]; persist(['meta/favs']); }

const loadImg = (src) => new Promise((resolve) => { const img = new Image(); img.onload = () => resolve(img.naturalWidth ? img : null); img.onerror = () => resolve(null); img.src = src; });
function drawScaled(img, maxEdge, square) {
  let sx = 0, sy = 0, sw = img.naturalWidth, sh = img.naturalHeight;
  if (square) { const m = Math.min(sw, sh); sx = (sw - m) / 2; sy = (sh - m) / 2; sw = m; sh = m; }
  const k = Math.min(1, maxEdge / Math.max(sw, sh));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(sw * k));
  c.height = Math.max(1, Math.round(sh * k));
  const g = c.getContext('2d');
  g.fillStyle = '#fff';
  g.fillRect(0, 0, c.width, c.height);
  g.imageSmoothingQuality = 'high';
  g.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}
const jpegBlob = (canvas, q) => new Promise((resolve) => canvas.toBlob((b) => resolve(b), 'image/jpeg', q));
// shrink until the data URL fits a database document
function fitDataUrl(img, maxEdge, maxChars, square) {
  let edge = maxEdge, q = 0.8;
  for (let i = 0; i < 7; i++) {
    const url = drawScaled(img, edge, square).toDataURL('image/jpeg', q);
    if (url.length <= maxChars) return url;
    edge = Math.round(edge * 0.82);
    q = Math.max(0.5, q - 0.05);
  }
  return '';
}

/* ---------- camera scan: photo → recipe in the cookbook ---------- */
const SCAN_JSON = '{"art":"rezept|gericht|name|nichts","grund":"",' + RECIPE_JSON.slice(1);
const SCAN_STEPS = ['Claude liest das Foto …', 'Zutaten werden sortiert …', 'Der Cosori-Schritt wird geplant …', 'Gleich fertig …'];
function scanPrompt(n, hint, people) {
