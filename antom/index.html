Bestimme zuerst, was zu sehen ist, und setze "art":
- "rezept": ein gedrucktes oder geschriebenes Rezept (Kochbuch, Zeitschrift, Rezeptkarte, handschriftlicher Zettel, Bildschirm, Packung). Übernimm es möglichst genau: keine Zutaten erfinden oder weglassen, nur fehlende Mengen sinnvoll ergänzen.
- "gericht": ein fertiges Gericht oder Essen. Erkenne es und schreibe ein passendes, alltagstaugliches Rezept dafür.
- "name": nur der Name eines Gerichts, etwa auf einem Kühlschrank-Magneten oder Zettel. Schreibe ein typisches Rezept dafür.
- "nichts": weder Essen noch ein Rezept erkennbar. Dann antworte nur {"art":"nichts","grund":"kurzer Grund"}.
${hint ? `Hinweis der Familie zum Foto: ${hint.slice(0, 200)}\n` : ''}Weitere Regeln:
- Mengen auf ${persons(people)} umrechnen.
- Die Familie hat einen Cosori Airfryer (Korb ca. 5,5 L, höchstens 200 °C). Schreibe Schritte für Backofen, Braten, Rösten oder Aufbacken auf den Cosori um – mit Temperatur, Minuten und wann geschüttelt wird. Sonst "af": null.
Antworte nur mit JSON in genau diesem Format:
${SCAN_JSON}
${RECIPE_RULES}`;
}
const maxShots = () => Math.max(1, Math.min(3, (UI.imgLimits && UI.imgLimits.maxCount) || 3));
function openScan(opener, ctx = {}) {
  const people = S.settings.people;
  const max = maxShots();
  const st = { shots: [], cur: 0, busy: false, status: '', ctl: null, hint: '', timer: 0 };
  const fileInput = (attrs) => `<input type="file" accept="image/*" class="vh" data-scan-add ${attrs}>`;
  const view = {
    render() {

      $('#sheet').innerHTML = `
        <div class="scan-top"><button type="button" class="cbtn" data-act="close" aria-label="Schließen">${icon('x')}</button><h2 id="sheetTitle">Rezept scannen</h2><span class="scan-count">${n ? `${n} / ${max}` : ''}</span></div>

          <div class="viewfinder" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        </div>
        ${n ? `<div class="scan-strip">${st.shots.map((x, i) => `<div class="scan-thumb${i === st.cur ? ' on' : ''}"><button type="button" class="pick" data-act="scan-show" data-i="${i}" aria-label="Foto ${i + 1} zeigen"><img src="${x.url}" alt=""></button>${st.busy ? '' : `<button type="button" class="del" data-act="scan-del" data-i="${i}" aria-label="Foto ${i + 1} entfernen">${icon('x')}</button>`}</div>`).join('')}${n < max && !st.busy ? `<label class="scan-add">${icon('plus')}<small>Seite</small>${fileInput('aria-label="Weitere Seite hinzufügen"')}</label>` : ''}</div>
        <label class="field scan-hint">Hinweis für Claude <span class="opt">(optional)</span><input id="scanHint" maxlength="200" placeholder="z. B. nur das Rezept unten rechts" value="${esc(st.hint)}"${st.busy ? ' disabled' : ''}></label>` : ''}

          : st.busy

    },
    add(files) {
      let skipped = 0;
      for (const file of files) {
        if (st.shots.length >= max) { skipped++; continue; }
        if (file.type && !/^image\//.test(file.type)) continue;
        st.shots.push({ file, url: URL.createObjectURL(file) });
      }
      st.cur = Math.max(0, st.shots.length - 1);

      this.render();
    },
    act(act, el) {

      if (signal.aborted) throw { code: 'cancelled' };
      const data = await sampleFn.json(scanPrompt(st.shots.length, st.hint.trim(), people), { signal, images });
      const art = data && typeof data.art === 'string' ? data.art.toLowerCase() : 'rezept';
      const draft = Object.assign(draftDefaults(people), fromClaude(data, people));
      if (art === 'nichts' || (!draft.ingPrev.length && !draft.steps.some((x) => x.t))) {

      }
      if (!draft.t) draft.t = (draft.name || 'Neues Rezept').split(/\s+/).slice(0, 4).join(' ');
      const kind = ['rezept', 'gericht', 'name'].includes(art) ? art : 'rezept';

      dishData.origin = 'scan';
      const pages = imgs.map((img) => (img ? fitDataUrl(img, 1400, Math.floor(240000 / imgs.length)) : '')).filter(okImg);
      if (pages.length) dishData.photo = { kind, n: pages.length };

}

/* ---------- Cosori timer ---------- */

  if (act === 'timer-stop') { stopTimer(); return; }
}
(() => {
  let x0 = null, y0 = 0;
  const cook = $('#cook');
  cook.addEventListener('touchstart', (e) => { if (e.touches.length === 1) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; } }, { passive: true });
  cook.addEventListener('touchend', (e) => {
    if (x0 == null || C.ing) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) cookAct(dx < 0 ? 'cook-next' : 'cook-prev');
  });
})();

/* ---------- onboarding (first start on a device) ---------- */
const OB_KEY = 'antom.onboarded';
const OB = [
  { img: 'ob-tisch', t: 'Euer Essen für die ganze Woche', p: 'Frühstück und Hauptessen für jeden Tag – wie die Magnettafel am Kühlschrank, nur immer dabei.' },
  { img: 'scan-card', t: 'Rezepte einfach abfotografieren', p: 'Kochbuch, Zeitschrift oder Omas Rezeptkarte: Foto machen, Antom legt das Rezept an.' },
  { img: 'ob-einkauf', t: 'Die Einkaufsliste schreibt sich selbst', p: 'Alle Zutaten der Woche zusammengerechnet und nach Supermarkt-Abteilungen sortiert.' },
  { img: 'ob-cosori', t: 'Kochen mit dem Cosori', p: 'Jedes Rezept mit Temperatur, Zeit und Schüttel-Erinnerung – Schritt für Schritt.' },
];
function showOnboarding() {
  const box = $('#onboard');
  let page = 0;
  box.innerHTML = `<button type="button" class="capsule ob-skip" data-act="ob-done">Überspringen</button>
    <div class="ob-pages" id="obPages">${OB.map((o, i) => `<section class="ob-page" aria-label="${i + 1} von ${OB.length}"><div class="ob-photo">${imgOf(o.img, 'l', i ? ' loading="lazy"' : ' fetchpriority="high"')}</div><div class="ob-text">${i === 0 ? '<p class="ob-brand"><img src="img/icon.webp" alt="" width="26" height="26">Antom</p>' : ''}<h2>${esc(o.t)}</h2><p>${esc(o.p)}</p></div></section>`).join('')}</div>
    <div class="ob-foot"><div class="ob-dots" aria-hidden="true">${OB.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div><button type="button" class="btn primary wide" data-act="ob-next">Weiter</button></div>`;
  box.hidden = false;
  box.classList.remove('out');
  document.documentElement.classList.add('locked');
  const pages = $('#obPages');
  const sync = () => {
    page = Math.round(pages.scrollLeft / Math.max(1, pages.clientWidth));
    $$('.ob-dots i', box).forEach((d, i) => d.classList.toggle('on', i === page));
    $('[data-act="ob-next"]', box).textContent = page >= OB.length - 1 ? 'Los geht’s' : 'Weiter';
  };
  pages.addEventListener('scroll', () => requestAnimationFrame(sync), { passive: true });
  box.obNext = () => {
    if (page >= OB.length - 1) { hideOnboarding(); return; }
    pages.scrollTo({ left: (page + 1) * pages.clientWidth, behavior: reduceMotion ? 'auto' : 'smooth' });
  };
  setTimeout(() => { const h = $('.ob-text h2', box); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); } }, 50);
}
function hideOnboarding() {
  const box = $('#onboard');
  if (box.hidden) return;
  try { localStorage.setItem(OB_KEY, '1'); } catch (e) { /* storage unavailable */ }
  const done = () => { box.hidden = true; box.innerHTML = ''; if (!UI.sheet && $('#cook').hidden) document.documentElement.classList.remove('locked'); };
  if (reduceMotion) { done(); return; }
  box.classList.add('out');
  setTimeout(done, 420);
}
function maybeOnboard() {
  let seen = true;
  try { seen = !!localStorage.getItem(OB_KEY); } catch (e) { seen = true; }
  if (!seen) showOnboarding();
}


/* ---------- events ---------- */
const backTo = (a) => (UI.sheet ? UI.opener : a);
document.addEventListener('click', (e) => {
  const t = e.target;
  const tab = t.closest('.tabbar [data-tab], .side-nav [data-tab]');
  if (tab) { setTab(tab.dataset.tab); return; }
  if (t.closest('#scrim')) { closeSheet(); return; }
  if (t.closest('#viewer')) { closeViewer(); return; }
  const a = t.closest('[data-act]');
  if (!a) return;
  const act = a.dataset.act;
  if (act === 'undo') { const fn = undoFn; undoFn = null; $('#toast').hidden = true; if (fn) fn(); return; }
  if (act === 'ob-next') { const box = $('#onboard'); if (box.obNext) box.obNext(); return; }
  if (act === 'ob-done') { hideOnboarding(); return; }
  if (act === 'timer-stop') { stopTimer(); return; }
  if (act === 'timer-plus') { T.end += 60000; T.left += 60; T.total += 60; tickTimer(); return; }
  if (act === 'timer-open') { if (T.dishId && dish(T.dishId)) { openCook(T.dishId, S.settings.people); const idx = Number(T.key.split(':')[1]); if (idx >= 0) { C.i = idx + 1; renderCook(); } } return; }
  if (a.closest('#cook')) { cookAct(act, a); return; }
  if (act === 'close') { closeSheet(); return; }
  if (a.closest('#sheet') && UI.sheet && UI.sheet.act && UI.sheet.act(act, a, e)) return;
  switch (act) {
    case 'open-dish': if (!dragGuard()) openRecipe(a.dataset.dish, null, a); return;
    case 'open-entry': if (!dragGuard()) openEntry(a.dataset.uid, a); return;
    case 'pick': { const back = backTo(a); closeSheet({ instant: true }); openPicker(a.dataset.date, a.dataset.slot, back, !!a.dataset.choose); return; }
    case 'cook': { const f = a.dataset.uid && findEntry(a.dataset.uid); openCook(a.dataset.dish, (f && f.entry.s) || S.settings.people); return; }
    case 'goto-day': { const el = $(`#day-${a.dataset.date}`); if (el) el.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' }); return; }
    case 'week-prev': setWeek(addDays(UI.week, -7)); return;
    case 'week-next': setWeek(addDays(UI.week, 7)); return;
    case 'week-today': setWeek(thisMonday()); return;
    case 'filter': UI.filter = a.dataset.f; renderBook(); if (a.closest('.sec-title')) $('#v-book').scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' }); return;
    case 'new-dish': { const back = backTo(a); closeSheet({ instant: true }); openForm(null, back, { t: a.dataset.title || '' }); return; }
    case 'import': { const back = backTo(a); closeSheet({ instant: true }); openImport(back); return; }
    case 'scan': {
      if (!canScan()) return;
      const back = backTo(a);
      closeSheet({ instant: true });
      openScan(back, a.dataset.date ? { date: a.dataset.date, slot: a.dataset.slot } : {});
      return;
    }
    case 'photo-view': { const src = (photoCache.get(a.dataset.id) || [])[Number(a.dataset.i)]; if (okImg(src)) openViewer(src); return; }
    case 'suggest': if (sampleFn) { const back = backTo(a); closeSheet({ instant: true }); openSuggest(back); } return;
    case 'settings': openSettings(a); return;
    case 'clear-week': { const back = backTo(a); closeSheet({ instant: true }); openClearWeek(back); return; }
    case 'copy-bf': closeSheet(); copyBreakfasts(); return;
    case 'copy-week': copyText(weekListText(), a); return;
    case 'shop-range': UI.shopRange = a.dataset.r; prefs.set('shopRange', UI.shopRange); renderShop(); renderChrome(); return;
    case 'clear-checked': {
      const before = snapshot();
      const wk = weekKey(UI.week);
      const sh = ensureShop(wk);
      sh.checked = {}; sh.extras = sh.extras.filter((x) => !x.done);
      persist(['shop/' + wk]); renderShop(); renderChrome();
      toast('Erledigte entfernt', { undo: () => restore(before) });
      return;
    }
    case 'need': { const wk = weekKey(UI.week); ensureShop(wk).need[a.dataset.key] = true; persist(['shop/' + wk]); renderShop(); renderChrome(); return; }
    case 'unneed': { e.preventDefault(); const wk = weekKey(UI.week); const sh = ensureShop(wk); delete sh.need[a.dataset.key]; delete sh.checked[a.dataset.key]; persist(['shop/' + wk]); renderShop(); renderChrome(); return; }
    case 'del-extra': { e.preventDefault(); const wk = weekKey(UI.week); const sh = ensureShop(wk); sh.extras = sh.extras.filter((x) => x.id !== a.dataset.id); persist(['shop/' + wk]); renderShop(); renderChrome(); return; }
    default:
  }
});
function afterCheck(input) {
  const row = input.closest('.item');
  if (input.checked) haptic(8);
  if (row && input.checked && !reduceMotion) { row.classList.add('leaving'); setTimeout(() => { renderShop(); renderChrome(); }, 300); }
  else { renderShop(); renderChrome(); }
}
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.matches('[data-act="toggle-item"]')) {
    const wk = weekKey(UI.week);
    const sh = ensureShop(wk);
    if (t.checked) sh.checked[t.dataset.key] = true; else delete sh.checked[t.dataset.key];
    persist(['shop/' + wk]);
    afterCheck(t);
  } else if (t.matches('[data-scan-add]')) {
    const files = Array.from(t.files || []);
    t.value = '';
    if (files.length && UI.sheet && UI.sheet.add) UI.sheet.add(files);
  } else if (t.matches('[data-act="toggle-extra"]')) {
    const wk = weekKey(UI.week);
    const x = ensureShop(wk).extras.find((i) => i.id === t.dataset.id);
    if (x) { x.done = t.checked; persist(['shop/' + wk]); afterCheck(t); }
  }
});
document.addEventListener('toggle', (e) => {
  const el = e.target;
  if (el.matches && el.matches('[data-fold]')) prefs.set(el.dataset.fold, el.open);
}, true);
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'extraForm') return;
  e.preventDefault();
  const input = $('#extraInput');
  const text = input.value.trim();
  if (!text) { input.focus(); return; }
  const wk = weekKey(UI.week);
  ensureShop(wk).extras.push({ id: rid(), t: text.slice(0, 120), done: false });
  persist(['shop/' + wk]);
  input.value = '';
  renderShop(); renderChrome();
  const again = $('#extraInput'); if (again) again.focus();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (closeViewer()) return;
    if (!$('#onboard').hidden) { hideOnboarding(); return; }
    if (!$('#cook').hidden) { if (C.ing) { C.ing = false; renderCook(); } else closeCook(); return; }
    if (UI.sheet) { closeSheet(); return; }
  }
  if (!$('#cook').hidden && (e.key === 'ArrowRight' || e.key === 'ArrowLeft') && !e.target.closest('input, textarea')) { cookAct(e.key === 'ArrowRight' ? 'cook-next' : 'cook-prev'); return; }
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t.getAttribute && t.getAttribute('role') === 'button' && t.dataset.act && t.tagName !== 'BUTTON') { e.preventDefault(); t.click(); }
});
$('#bookSearch').addEventListener('input', (e) => { UI.query = e.target.value; renderBook(); });
$('#shelfSearch').addEventListener('input', (e) => { UI.shelfQuery = e.target.value; renderShelf(); });
phoneMQ.addEventListener('change', () => { if (!phoneMQ.matches) document.documentElement.classList.remove('sheet-deep'); });
// a new day starts while the app stays open: move "today" along
let lastDay = todayKey();
setInterval(() => { if (todayKey() !== lastDay) { const wasCur = +UI.week === +mondayOf(fromKey(lastDay)); lastDay = todayKey(); if (wasCur) UI.week = thisMonday(); histDirty(); UI.builtWeek = null; renderAll(); } }, 60000);

/* ---------- boot ---------- */
document.documentElement.lang = 'de';
initSortables();
renderAll();
maybeOnboard();

(async () => {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') { startLocal('device'); return; }
  c.use('sample').then(async (fn) => {
    sampleFn = typeof fn === 'function' ? fn : null;
    if (sampleFn && typeof sampleFn.limits === 'function') {
      try { const lim = await sampleFn.limits(); UI.canImages = !!(lim && lim.images); UI.imgLimits = (lim && lim.images) || null; } catch (e) { UI.canImages = false; }
    }
    queueRender('plan', 'book');
  }).catch(() => { sampleFn = null; });
  let db = null, user = null;
  try { [db, user] = await Promise.all([c.use('db'), c.use('user').catch(() => null)]); } catch (e) { db = null; }
  if (!db) { startLocal('device'); return; }
  let can = null;
  try { can = user && typeof user.can === 'function' ? await user.can('data.write') : null; } catch (e) { can = null; }
  if (can === false) { startLocal('readonly'); return; }
  startShared(db);
})();
})();
</script>
