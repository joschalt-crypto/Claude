# Antom als eigene Web-App: ein Cloudflare Worker liefert die App aus, hält den
# Familienplan in einem Durable Object (SQLite) und leitet Claude-Anfragen weiter.
# Geheimnisse (nicht hier eintragen, sondern als Worker-Secrets):
#   FAMILY_KEY         langer Zufallsschlüssel, steckt im Einladungslink /f/<FAMILY_KEY>/
#   ANTHROPIC_API_KEY  API-Schlüssel aus console.anthropic.com
name = "antom"
main = "src/worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
# jede Anfrage geht durch den Worker: ohne Familienschlüssel gibt es nur die Startseite
run_worker_first = true

[[durable_objects.bindings]]
name = "FAMILY"
class_name = "Family"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Family"]

[vars]
# höchstens so viele Claude-Anfragen pro Tag (Schutz vor unerwarteten Kosten)
CLAUDE_DAILY_LIMIT = "40"
