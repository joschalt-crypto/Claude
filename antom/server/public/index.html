<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Antom</title>
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<style>
:root { color-scheme: light dark; --bg: #f2f2f7; --fg: #0b1026; --muted: #5d6275; --card: #fff; }
@media (prefers-color-scheme: dark) { :root { --bg: #070b1d; --fg: #eef0f8; --muted: #a4a9bd; --card: #121733; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; background: var(--bg); color: var(--fg); font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 26rem; padding: 32px 28px; border-radius: 24px; background: var(--card); text-align: center; box-shadow: 0 18px 40px -24px rgba(0, 0, 0, .35); }
img { width: 84px; height: 84px; border-radius: 20px; }
h1 { margin: 16px 0 8px; font-family: Georgia, "New York", serif; font-size: 30px; }
p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Antom</h1>
  <p>Dieser Wochenplan ist privat. Bitte den Einladungslink öffnen, den ihr von eurer Familie bekommen habt.</p>
</main>
</body>
</html>
