<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 600 900"
     width="600" height="900"
     fill="none"
     role="img"
     aria-label="Altex Agency">
  <title>Altex Agency</title>

  <defs>
    <!-- Tokens kept as named variables in comments for clarity -->
    <!-- ink:    #0A1628  (deep navy, near-black)            -->
    <!-- accent: #00E0FF  (electric blue)                    -->
  </defs>

  <!-- Transparent background by design -->

  <!-- ============================================================
       MONOGRAM "A"
       Architectural triangular A built from precise stroked paths.
       The crossbar is split in two — left half ink, right half
       electric — a subtle "interlock / connection" cue without
       resorting to the obvious orbit-ring cliché.
       ============================================================ -->
  <g transform="translate(300 372)"
     stroke-linecap="square"
     stroke-linejoin="miter"
     stroke-miterlimit="10">

    <!-- Left leg -->
    <path d="M 0 -108 L -92 108"
          stroke="#0A1628"
          stroke-width="5"/>

    <!-- Right leg -->
    <path d="M 0 -108 L 92 108"
          stroke="#0A1628"
          stroke-width="5"/>

    <!-- Crossbar — left half (ink) -->
    <path d="M -44 26 L 0 26"
          stroke="#0A1628"
          stroke-width="5"/>

    <!-- Crossbar — right half (electric accent) -->
    <path d="M 0 26 L 44 26"
          stroke="#00E0FF"
          stroke-width="5"/>

    <!-- Apex node — small precise square, architectural feel -->
    <rect x="-4" y="-112" width="8" height="8" fill="#00E0FF"/>
  </g>

  <!-- ============================================================
       DIVIDER
       Hairline rule between mark and wordmark. Short, centered,
       electric — Swiss-typographic restraint.
       ============================================================ -->
  <line x1="280" y1="540" x2="320" y2="540"
        stroke="#00E0FF"
        stroke-width="1.2"/>

  <!-- ============================================================
       WORDMARK
       "ALTEX" set large with wide tracking; "A G E N C Y" set
       small and very wide-tracked beneath, mirroring the cadence
       of the Tommy Martins card.
       ============================================================ -->
  <g text-anchor="middle" fill="#0A1628">
    <text x="300" y="610"
          font-family="'Inter', 'Helvetica Neue', 'Helvetica', 'Arial', sans-serif"
          font-size="34"
          font-weight="600"
          letter-spacing="12">ALTEX</text>
    <text x="300" y="648"
          font-family="'Inter', 'Helvetica Neue', 'Helvetica', 'Arial', sans-serif"
          font-size="11"
          font-weight="400"
          letter-spacing="7">A G E N C Y</text>
  </g>
</svg>
